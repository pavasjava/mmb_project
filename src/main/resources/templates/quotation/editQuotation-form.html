<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Add/Edit Quotation</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss/dist/tailwind.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            opacity: 0.03;
            z-index: -1;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f8fafc;
        }

        .container-card {
            width: 1400px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .container-card:hover {
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.1);
        }

        .form-label {
            display: block;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.2s ease;
            background-color: #fcfdfe;
        }

        .form-input:focus {
            outline: none;
            border-color: #4299e1;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.15);
            background-color: white;
        }

        .form-select {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.2s ease;
            background-color: #fcfdfe;
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 16px center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
            padding-right: 40px;
        }

        .form-select:focus {
            outline: none;
            border-color: #4299e1;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.15);
            background-color: white;
        }

        .btn-cancel {
            background-color: #f1f5f9;
            color: #64748b;
            padding: 12px 28px;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.2s ease;
            border: 1.5px solid #e2e8f0;
        }

        .btn-cancel:hover {
            background-color: #e2e8f0;
            transform: translateY(-1px);
        }

        .btn-save {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 12px 28px;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-save:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.3);
        }

        .dropdown-btn {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            background-color: #fcfdfe;
            cursor: pointer;
            text-align: left;
            position: relative;
            transition: all 0.2s ease;
        }

        .dropdown-btn:after {
            content: '▼';
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 12px;
            color: #6b7280;
        }

        .dropdown-btn:hover {
            border-color: #cbd5e0;
            background-color: white;
        }

        .dropdown-panel {
            position: absolute;
            z-index: 50;
            margin-top: 8px;
            width: 100%;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            border: 1px solid #e2e8f0;
            max-height: 240px;
            overflow-y: auto;
            display: none;
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .dropdown-item:hover {
            background-color: #f8fafc;
        }

        .dropdown-item input[type="checkbox"] {
            margin-right: 12px;
            width: 18px;
            height: 18px;
            border-radius: 4px;
            border: 1.5px solid #cbd5e0;
            cursor: pointer;
        }

        .selected-chip {
            display: inline-flex;
            align-items: center;
            background: #d1fae5;
            color: #065f46;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            margin: 4px 4px 4px 0;
        }

        .selected-chip i {
            margin-left: 6px;
            cursor: pointer;
            font-size: 12px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #f1f5f9;
            position: relative;
        }

        .section-title:after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, #4299e1 0%, #667eea 100%);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
        }

        @media (max-width: 768px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }

        /* Smooth animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fadeIn {
            animation: fadeIn 0.3s ease-out;
        }

        .page-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem 0;
            margin-bottom: 2rem;
        }

        .main-content {
            margin-left: 280px;
            transition: all 0.3s ease;
            min-height: 100vh;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
        }

        .main-content-expanded {
            margin-left: 80px;
        }

        .main-content-full {
            margin-left: 0;
        }

        @media (max-width: 768px) {
            .main-content {
                margin-left: 0 !important;
            }
        }
    </style>
</head>

<body class="bg-gray-50">
    <!-- Background Overlay -->
    <div class="bg-overlay"></div>

    <!-- Admin Sidebar -->
    <div th:replace="fragments/admin-navbar :: admin-sidebar"></div>

    <!-- Main Content Area -->
    <div class="main-content" id="mainContent">
        <!-- Top Navbar -->
        <div th:replace="fragments/top-navbar :: top-navbar"></div>

        <!-- Main Form Content -->
        <div class="max-w-6xl mx-auto px-4 py-8">
            <div class="container-card p-8">
                <!-- Header -->
                <div class="mb-10">
                    <h2 class="text-3xl font-bold text-gray-800 mb-2">Edit Quotation</h2>
                    <p class="text-gray-600">Fill in the details below to update a quotation</p>
                </div>

                <!-- Form -->
                <form th:action="@{/quotations/saveQuotation}" th:object="${quotation}" method="post"
                    class="space-y-8">

                    <!-- Hidden field for edit -->
                    <input type="hidden" th:field="*{quotationId}" />

                    <!-- Section 1: Customer Details -->
                    <div>
                        <h3 class="section-title">Customer Information</h3>
                        <div class="grid-2">
                            <div>
                                <label class="form-label">Customer Name</label>
                                <input type="text" th:field="*{customerName}" class="form-input"
                                    placeholder="Enter customer name" />
                            </div>
                            <div>
                                <label class="form-label">Work Address</label>
                                <input type="text" th:field="*{workAddress}" class="form-input"
                                    placeholder="Enter work address" />
                            </div>
                        </div>
                    </div>

                    <!-- Section 2: Boring Details -->
                    <div>
                        <h3 class="section-title">Boring Specifications</h3>
                        <div class="grid-2">
                            <div>
                                <label class="form-label">Boring Type</label>
                                <select th:field="*{boringType}" class="form-select">
                                    <option value="">-- Select Boring Type --</option>
                                    <option value="DTH">DTH</option>
                                    <option value="In-Well">In-Well</option>
                                    <option value="Rotary">Rotary</option>
                                    <option value="Callis">Callis</option>
                                </select>
                            </div>
                            <div>
                                <label class="form-label">Boring Diameter</label>
                                <select th:field="*{boringDia}" class="form-select">
                                    <option value="">-- Select Boring Diameter --</option>
                                    <option value="5">5 inch</option>
                                    <option value="6">6 inch</option>
                                    <option value="8">8 inch</option>
                                    <option value="10">10 inch</option>
                                    <option value="12">12 inch</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Section 3: Pricing Details -->
                    <div>
                        <h3 class="section-title">Pricing Details</h3>
                        <div class="grid-2">
                            <div>
                                <label class="form-label">Price Quantity Details</label>
                                <select th:field="*{priceQntDtls}" class="form-select">
                                    <option value="">-- Select Quantity Unit --</option>
                                    <option value="1 Feet">1 Feet</option>
                                    <option value="1 Mtr.">1 Meter</option>
                                </select>
                            </div>
                            <div>
                                <label class="form-label">Drilling Price</label>
                                <div class="relative">
                                    <span class="absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-500 mr-2">₹</span>
                                    <input type="number" th:field="*{drillingPrice}" class="form-input pl-12"
                                        placeholder="0.00" />
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Section 4: Materials -->
                    <div>
                        <h3 class="section-title">Required Materials</h3>
                        <div class="relative">
                            <label class="form-label mb-2">Select Required Materials</label>
                            <div class="dropdown-btn" id="dropdown-btn">
                                Select Materials
                            </div>
                            <div id="dropdown-panel" class="dropdown-panel">
                                <div th:each="mat : ${materials}" class="dropdown-item">
                                    <input type="checkbox" th:id="'mat-' + ${mat.materialId}"
                                        th:value="${mat.materialId}" th:data-name="${mat.materialWithCmpName}"
                                        th:field="*{requiredMaterialIds}" class="mr-2 material-checkbox" />
                                    <label th:for="'mat-' + ${mat.materialId}" th:text="${mat.materialWithCmpName}"
                                        class="cursor-pointer flex-1"></label>
                                </div>
                            </div>

                            <!-- Selected Materials Display -->
                            <div id="selected-container" class="mt-4 hidden">
                                <p class="form-label">Selected Materials:</p>
                                <div id="selected-materials" class="flex flex-wrap gap-2 mt-2"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Section 5: Transport Details -->
                    <div>
                        <h3 class="section-title">Transportation Details</h3>
                        <div class="grid-2">
                            <div>
                                <label class="form-label">Transport Vehicle Type</label>
                                <select th:field="*{transportingVehicleType}" class="form-select">
                                    <option value="">-- Select Vehicle Type --</option>
                                    <option value="small">Small</option>
                                    <option value="medium">Medium</option>
                                    <option value="large">Large</option>
                                </select>
                            </div>
                            <div>
                                <label class="form-label">Transport Price</label>
                                <div class="relative">
                                    <span class="absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-500 mr-2">₹</span>
                                    <input type="number" th:field="*{transportingPrice}" class="form-input pl-12"
                                        placeholder="0.00" />
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Form Actions -->
                    <div class="pt-8 border-t border-gray-200 flex justify-end space-x-4">
                        <a href="/quotations/getAllQuotation" class="btn-cancel">
                            <i class="fas fa-times mr-2"></i>Cancel
                        </a>
                        <button type="submit" class="btn-save">
                            <i class="fas fa-save mr-2"></i>Save Quotation
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Initialize main content based on sidebar state
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('mainContent');

            if (sidebar && mainContent) {
                const savedState = localStorage.getItem('sidebarCollapsed');
                if (savedState === 'true') {
                    mainContent.classList.add('main-content-expanded');
                    mainContent.classList.remove('main-content-full');
                } else {
                    mainContent.classList.remove('main-content-expanded');
                    mainContent.classList.add('main-content-full');
                }
            }

            // Material dropdown functionality
            const dropdownBtn = document.getElementById("dropdown-btn");
            const dropdownPanel = document.getElementById("dropdown-panel");
            const checkboxes = document.querySelectorAll(".material-checkbox");
            const selectedContainer = document.getElementById("selected-container");
            const selectedMaterialsDiv = document.getElementById("selected-materials");

            // Toggle dropdown with animation
            dropdownBtn.addEventListener("click", (e) => {
                e.stopPropagation();
                dropdownPanel.style.display = dropdownPanel.style.display === 'block' ? 'none' : 'block';
            });

            // Update selected materials display
            function updateSelected() {
                selectedMaterialsDiv.innerHTML = "";
                let selectedTexts = [];

                checkboxes.forEach(cb => {
                    if (cb.checked) {
                        const materialName = cb.getAttribute("data-name");
                        selectedTexts.push(materialName);

                        // Create chip for selected material
                        const chip = document.createElement("div");
                        chip.className = "selected-chip";
                        chip.innerHTML = `
                            ${materialName}
                            <i class="fas fa-times" data-id="${cb.value}"></i>
                        `;

                        // Add remove functionality
                        chip.querySelector("i").addEventListener("click", function () {
                            const checkboxId = this.getAttribute("data-id");
                            const checkbox = document.querySelector(`.material-checkbox[value="${checkboxId}"]`);
                            if (checkbox) {
                                checkbox.checked = false;
                                updateSelected();
                            }
                        });

                        selectedMaterialsDiv.appendChild(chip);
                    }
                });

                // Update dropdown button text
                if (selectedTexts.length > 0) {
                    dropdownBtn.textContent = `${selectedTexts.length} material(s) selected`;
                    selectedContainer.classList.remove("hidden");
                } else {
                    dropdownBtn.textContent = "Select Materials";
                    selectedContainer.classList.add("hidden");
                }
            }

            // Initialize checkbox event listeners
            checkboxes.forEach(cb => {
                cb.addEventListener("change", updateSelected);

                // Prevent closing dropdown when clicking checkbox
                cb.addEventListener("click", (e) => {
                    e.stopPropagation();
                });
            });

            // Close dropdown when clicking outside
            document.addEventListener("click", function (event) {
                if (!dropdownBtn.contains(event.target) && !dropdownPanel.contains(event.target)) {
                    dropdownPanel.style.display = 'none';
                }
            });

            // Close dropdown when pressing Escape
            document.addEventListener("keydown", function (event) {
                if (event.key === "Escape") {
                    dropdownPanel.style.display = 'none';
                }
            });

            // Initialize selected materials from existing data (if editing)
            updateSelected();
        });
    </script>
</body>

</html>
