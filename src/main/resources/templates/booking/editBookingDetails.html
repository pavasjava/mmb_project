<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Booking</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss/dist/tailwind.min.css">
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

	<style>
		.bg-overlay {
			position: fixed;
			top: 0;
			left: 0;
			height: 100%;
			width: 100%;
			background-image: url('/images/bgimage.png');
			background-size: cover;
			background-position: center;
			opacity: 0.08;
			z-index: -1;
		}

		body {
			font-family: Arial, sans-serif;
			margin: 0;
			padding: 0;
			background-color: #f4f8fb;
			color: #333;
		}

		.navbar {
			display: flex;
			align-items: center;
			justify-content: space-between;
			background-color: #d64026;
			padding: 10px 20px;
		}

		.navbar-left {
			display: flex;
			align-items: center;
			gap: 20px;
		}

		.navbar-left img {
			height: 40px;
			width: 65px;
			border-radius: 60%;
			object-fit: cover;
		}

		.navbar-left a {
			text-decoration: none;
			color: white;
			font-weight: bold;
			padding: 8px 12px;
			border-radius: 8px;
			transition: background-color 0.3s;
		}

		.navbar-left a.active,
		.navbar-left a:hover {
			background-color: #c23c22;
		}

		.navbar-right {
			display: flex;
			align-items: center;
			gap: 20px;
		}

		.search-box {
			background-color: white;
			border-radius: 10px;
			padding: 8px 12px;
			display: flex;
			align-items: center;
		}

		.search-box input {
			border: none;
			outline: none;
			font-size: 14px;
			margin-left: 5px;
		}

		.search-icon {
			color: #d64026;
			font-size: 16px;
		}

		.social-icons i {
			font-size: 18px;
			color: white;
			transition: transform 0.2s;
		}

		.social-icons i:hover {
			transform: scale(1.2);
			color: #ffc107;
		}

		.container {
			max-width: 1200px;
			margin: 50px auto;
			padding: 40px;
			background-color: white;
			box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
			border-radius: 12px;
		}

		h1 {
			text-align: left;
			color: #2c3e50;
			margin-bottom: 20px;
		}

		p {
			font-size: 17px;
			line-height: 1.7;
			text-align: justify;
		}

		.footer {
			margin-top: 30px;
			text-align: center;
			font-size: 14px;
			color: #777;
		}

		.modal {
			display: none;
			position: fixed;
			z-index: 999;
			padding-top: 60px;
			left: 0;
			top: 0;
			width: 100%;
			height: 100%;
			overflow: auto;
			background-color: rgba(0, 0, 0, 0.8);
		}

		.modal-content {
			margin: auto;
			display: block;
			max-width: 90%;
			max-height: 80%;
			border-radius: 10px;
		}

		.close {
			position: absolute;
			top: 30px;
			right: 50px;
			color: #fff;
			font-size: 35px;
			font-weight: bold;
			cursor: pointer;
		}

		.close:hover {
			color: #ccc;
		}

		h2.bullet::before {
			content: "•";
			font-size: 36px;
			color: #2c3e50;
			margin-right: 12px;
			vertical-align: middle;
		}
	</style>
</head>

<body class="bg-gray-100 p-6">

	<!-- ✅ Background Image -->
	<div class="bg-overlay"></div>

	<!-- ✅ Navbar -->
	<div th:replace="~{fragments/navbar :: navbar}"></div><br>

	<div class="max-w-3xl mx-auto bg-white shadow-lg rounded-xl p-6">
		<h2 class="text-2xl font-bold mb-4">Book Service</h2>

		<form th:action="@{/bookings/updateBooking}" th:object="${bookings}" method="post" class="space-y-4">
			<input type="hidden" th:field="*{bookingId}" />

			<div>
				<label>Customer Name:</label>
				<input type="text" th:field="*{customerName}" class="border p-2 rounded w-full" />
			</div>

			<div>
				<label>Phone Number:</label>
				<input type="text" th:field="*{phoneNumber}" class="border p-2 rounded w-full" />
			</div>

			<div>
				<label>City:</label>
				<select id="city" th:field="*{city.cityId}" class="form-control">
					<option value="">-- Select City --</option>
					<option th:each="city : ${cities}" th:value="${city.cityId}" th:text="${city.cityName}">
					</option>
				</select>
			</div>

			<div>
				<label>Area:</label>
				<select id="area" th:field="*{area.locationAreaId}" class="form-control">
					<option value="">-- Select Area --</option>
					<option th:each="area : ${areas}" th:value="${area.locationAreaId}"
						th:text="${area.locationAreaName}">
					</option>
				</select>
			</div>

			<div>
				<label>Borewell Type:</label>
				<select id="borewellType" th:field="*{borewellType.borewelTypeid}"
					class="w-full border rounded px-3 py-2">
					<option value="">-- Select Borewell Type --</option>
					<option th:each="borewellType : ${borewellTypes}" th:value="${borewellType.borewelTypeid}"
						th:text="${borewellType.name}">
					</option>
				</select>
			</div>

			<div>
				<label>Borewell Size:</label>
				<select id="drillingSizeSelect" th:field="*{drillingSize}" class="w-full border rounded px-3 py-2">
					<option value=""> -- Select Boring Size -- </option>
					<option value="5">5 inch/127mm</option>
					<option value="6">6 inch/152.4mm</option>
					<option value="8">8 inch/203.2mm</option>
					<option value="oth">Other</option>
				</select>
				<input type="text" id="otherDrillingSize" th:field="*{otherSize}" placeholder="Enter drilling size"
									class="w-full border rounded px-3 py-2 mt-2" style="display:none;">
			</div>

			<div>
				<label>Price</label>
				<input type="number" step="0.01" id="price" th:field="*{price}" class="form-control" readonly>
			</div>
			<div>
			    <label class="block text-sm font-medium text-gray-700">Booking Date</label>
				<input type="date" th:value="${#temporals.format(bookings.bookingDate, 'yyyy-MM-dd')}" 
								       name="bookingDate"
								       class="w-60 border rounded px-3 py-2">
			</div>

			<button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">Update</button>
		</form>
	</div>
</body>
<script>
	document.getElementById("city").addEventListener("change", function () {
		const cityId = this.value;
		const areaDropdown = document.getElementById("area");
		areaDropdown.innerHTML = '<option value="">-- Select Area --</option>';

		if (cityId) {
			fetch("/api/areas/byCity/" + cityId)
				.then(response => {
					if (!response.ok) throw new Error("HTTP " + response.status);
					return response.json();
				})
				.then(data => {
					if (data.length === 0) {
						console.warn("No areas found for cityId:", cityId);
					}
					data.forEach(area => {
						const option = document.createElement("option");
						option.value = area.locationAreaId;
						option.text = area.locationAreaName;
						areaDropdown.appendChild(option);
					});
				})
				.catch(err => console.error("Error fetching areas:", err));
		}
	});
</script>

<script>

	function fetchPrice() {
	    const cityId = document.getElementById("city").value;
	    const areaId = document.getElementById("area").value;
	    const borewellTypeId = document.getElementById("borewellType").value;
	    const drillingSize = document.getElementById("drillingSizeSelect").value;

	    if (cityId && areaId && borewellTypeId && drillingSize) {
	        fetch(`/api/prices/findPrice?borewellTypeId=${borewellTypeId}&cityId=${cityId}&locationAreaId=${areaId}&drillingSize=${drillingSize}`)
	            .then(response => response.json())
	            .then(price => {
	                document.getElementById("price").value = price;
	            })
	            .catch(error => console.error("Error fetching price:", error));
	    }
	}

</script>



</html>
