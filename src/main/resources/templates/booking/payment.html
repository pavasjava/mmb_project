<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Payment</title>
	<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
	<script>
		function openModal(method) {
			document.getElementById('selectedMethod').innerText = method;
			document.getElementById('upiModal').classList.remove('hidden');
			document.getElementById('verifyStatus').innerText = '';
			document.getElementById('paymentSection').classList.add('hidden');
			document.getElementById('upiIdInput').value = '';
		}

		function verifyUpi() {
			const upiId = document.getElementById('upiIdInput').value;
			if (upiId.trim() !== '') {
				document.getElementById('verifyStatus').innerText = '✔️ UPI ID Verified';
				document.getElementById('paymentSection').classList.remove('hidden');
			} else {
				document.getElementById('verifyStatus').innerText = '❌ Enter a valid UPI ID';
				document.getElementById('paymentSection').classList.add('hidden');
			}
		}

		function closeModal() {
			document.getElementById('upiModal').classList.add('hidden');
		}
	</script>
</head>

<body class="bg-gray-100 font-sans">

	<!-- Main Content -->
	<div class="max-w-6xl mx-auto mt-32 bg-white shadow-lg rounded-lg overflow-hidden flex">

		<!-- Sidebar -->
		<aside class="w-1/3 bg-gray-50 border-r p-4 space-y-3 text-sm font-medium text-gray-700">
			<div class="text-pink-600 font-semibold mb-2">Payment Options</div>
			<ul class="space-y-2">
				<li class="text-pink-700 font-semibold">Pay by any UPI App</li>
			</ul>
		</aside>

		<!-- Payment Panel -->
		<main class="w-2/3 p-8">
			<h2 class="text-xl font-semibold mb-6 flex items-center">
				<img src="https://assets-in.bmscdn.com/paymentcms/OTHERUPI.png" class="h-8 mr-3" alt="UPI">
				Pay by any UPI App
			</h2>

			<div class="grid grid-cols-2 gap-6">
				<!-- Payment Options -->
				<label onclick="openModal('Google Pay')" class="flex items-center space-x-4 cursor-pointer border p-4 rounded hover:shadow">
					<input type="radio" name="upiMethod" value="GPay" class="form-radio h-5 w-5 text-indigo-600" readonly>
					<img src="https://assets-in.bmscdn.com/paymentcms/gpay.jpg" class="h-10" alt="GPay">
					<span class="ml-2 text-lg">Google Pay</span>
				</label>

				<label onclick="openModal('Amazon Pay')" class="flex items-center space-x-4 cursor-pointer border p-4 rounded hover:shadow">
					<input type="radio" name="upiMethod" value="AmazonPay" class="form-radio h-5 w-5 text-indigo-600" readonly>
					<img src="https://assets-in.bmscdn.com/paymentcms/Amazonpay.png" class="h-10" alt="Amazon Pay">
					<span class="ml-2 text-lg">Amazon Pay UPI</span>
				</label>

				<label onclick="openModal('BHIM')" class="flex items-center space-x-4 cursor-pointer border p-4 rounded hover:shadow">
					<input type="radio" name="upiMethod" value="BHIM" class="form-radio h-5 w-5 text-indigo-600" readonly>
					<img src="https://assets-in.bmscdn.com/paymentcms/bhim_web.png" class="h-10" alt="BHIM">
					<span class="ml-2 text-lg">BHIM</span>
				</label>

				<label onclick="openModal('Paytm')" class="flex items-center space-x-4 cursor-pointer border p-4 rounded hover:shadow">
					<input type="radio" name="upiMethod" value="Paytm" class="form-radio h-5 w-5 text-indigo-600" readonly>
					<img src="https://upload.wikimedia.org/wikipedia/commons/3/3a/Paytm_logo.png" class="h-10" alt="Paytm">
					<span class="ml-2 text-lg">Paytm</span>
				</label>

				<label onclick="openModal('PhonePe')" class="flex items-center space-x-4 cursor-pointer border p-4 rounded hover:shadow">
					<input type="radio" name="upiMethod" value="PhonePe" class="form-radio h-5 w-5 text-indigo-600" readonly>
					<img src="https://assets-in.bmscdn.com/paymentcms/phonepe_web.png" class="h-10" alt="PhonePe">
					<span class="ml-2 text-lg">PhonePe</span>
				</label>

				<label onclick="openModal('Other')" class="flex items-center space-x-4 cursor-pointer border p-4 rounded hover:shadow">
					<input type="radio" name="upiMethod" value="Other" class="form-radio h-5 w-5 text-indigo-600" readonly>
					<img src="https://assets-in.bmscdn.com/paymentcms/OTHERUPI.png" class="h-10" alt="Other UPI">
					<span class="ml-2 text-lg">Other UPI</span>
				</label>
			</div>
		</main>
	</div>

	<!-- Modal -->
	<div id="upiModal" class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center hidden z-50">
		<div class="bg-white rounded-lg p-6 w-full max-w-md shadow-xl">
			<div class="flex justify-between items-center mb-4">
				<h3 class="text-lg font-semibold text-gray-700">Enter UPI ID for <span id="selectedMethod" class="text-indigo-600"></span></h3>
				<button onclick="closeModal()" class="text-gray-400 hover:text-red-500 text-2xl font-bold">&times;</button>
			</div>
			<div class="space-y-4">
				<input type="text" id="upiIdInput" placeholder="example@upi" class="w-full p-3 border rounded focus:outline-none focus:ring-2 focus:ring-indigo-500" />
				<button onclick="verifyUpi()" class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-700 transition">Verify UPI</button>
				<p id="verifyStatus" class="text-sm font-medium text-center"></p>
			</div>

			<form th:action="@{/payment}" method="post" id="paymentSection" class="hidden mt-6 text-center">
				<p class="text-lg mb-2 font-semibold">Amount: ₹<span th:text="${amount}">0</span></p>
				<button type="submit" class="bg-indigo-600 text-white px-6 py-3 rounded-full font-semibold hover:bg-indigo-700 transition">
					Proceed to Pay ₹<span th:text="${amount}">0</span>
				</button>
			</form>
		</div>
	</div>
</body>

</html>
