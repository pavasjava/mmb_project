<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking History - Borewell Services</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        .timeline-item {
            position: relative;
            padding-left: 30px;
            margin-bottom: 30px;
        }
        
        .timeline-item:before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: -30px;
            width: 2px;
            background: #e5e7eb;
        }
        
        .timeline-item:last-child:before {
            display: none;
        }
        
        .timeline-dot {
            position: absolute;
            left: -6px;
            top: 0;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #2563eb;
            border: 2px solid white;
            box-shadow: 0 0 0 2px #bfdbfe;
        }
        
        .version-badge {
            background: #f3f4f6;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #4b5563;
        }
        
        .version-current {
            background: #10b981;
            color: white;
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="max-w-7xl mx-auto px-4 py-8">
        <!-- Header -->
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold text-gray-800 flex items-center">
                    <i class="fas fa-history text-blue-600 mr-3"></i>
                    Booking History
                </h1>
                <p class="text-gray-600 mt-2">
                    Tracking changes for Booking #<span th:text="${booking.bookingId}"></span>
                </p>
            </div>
            <a th:href="@{'/bookings/edit/' + ${booking.bookingId}}" 
               class="px-6 py-3 bg-gray-600 text-white rounded-lg hover:bg-gray-700 transition-all">
                <i class="fas fa-arrow-left mr-2"></i>
                Back to Edit
            </a>
        </div>
        
        <!-- Current Booking Summary -->
        <div class="bg-gradient-to-r from-blue-500 to-indigo-600 rounded-xl p-6 text-white mb-8">
            <div class="flex justify-between items-start">
                <div>
                    <h2 class="text-xl font-bold mb-4">Current Booking Version</h2>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div>
                            <p class="text-blue-100 text-sm">Customer</p>
                            <p class="font-semibold" th:text="${booking.customerName}"></p>
                        </div>
                        <div>
                            <p class="text-blue-100 text-sm">Total Amount</p>
                            <p class="font-semibold" th:text="'₹' + ${booking.grandTotal}"></p>
                        </div>
                        <div>
                            <p class="text-blue-100 text-sm">Booking Date</p>
                            <p class="font-semibold" th:text="${#temporals.format(booking.bookingDate, 'dd MMM yyyy')}"></p>
                        </div>
                        <div>
                            <p class="text-blue-100 text-sm">Last Updated</p>
                            <p class="font-semibold" th:text="${#temporals.format(booking.lastUpdatedDate, 'dd MMM yyyy HH:mm')}"></p>
                        </div>
                    </div>
                </div>
                <span class="version-badge version-current">
                    <i class="fas fa-check-circle mr-1"></i>
                    Current Version
                </span>
            </div>
        </div>
        
        <!-- Audit History Timeline -->
        <div class="bg-white rounded-xl shadow-lg p-8">
            <h3 class="text-lg font-bold text-gray-800 mb-6 flex items-center">
                <i class="fas fa-clock-rotate-left text-gray-600 mr-2"></i>
                Change History
            </h3>
            
            <div th:if="${auditHistory.isEmpty()}" class="text-center py-12 text-gray-500">
                <i class="fas fa-history text-4xl mb-4 opacity-50"></i>
                <p>No history available for this booking</p>
            </div>
            
            <div th:each="audit, iterStat : ${auditHistory}" class="timeline-item">
                <div class="timeline-dot" 
                     th:classappend="${iterStat.index == 0} ? 'bg-green-500' : 'bg-blue-500'"></div>
                
                <div class="bg-gray-50 rounded-lg p-6 hover:shadow-md transition-shadow">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <span class="version-badge mr-3">
                                <i class="fas fa-code-branch mr-1"></i>
                                Version <span th:text="${auditHistory.size() - iterStat.index}"></span>
                            </span>
                            <span class="text-sm text-gray-500">
                                <i class="fas fa-user mr-1"></i>
                                <span th:text="${audit.changedBy}"></span>
                            </span>
                        </div>
                        <div class="text-sm text-gray-500">
                            <i class="fas fa-calendar-alt mr-1"></i>
                            <span th:text="${#temporals.format(audit.changedDate, 'dd MMM yyyy HH:mm:ss')}"></span>
                        </div>
                    </div>
                    
                    <div class="grid md:grid-cols-2 gap-4 mb-4">
                        <div>
                            <h4 class="text-xs font-semibold text-gray-500 uppercase mb-2">Changes Made</h4>
                            <div class="space-y-2">
                                <p th:each="change : ${audit.changes}" 
                                   class="text-sm bg-white p-2 rounded border-l-4 border-blue-500">
                                    <span th:text="${change}"></span>
                                </p>
                            </div>
                        </div>
                        
                        <div>
                            <h4 class="text-xs font-semibold text-gray-500 uppercase mb-2">Change Summary</h4>
                            <div class="bg-white p-3 rounded">
                                <p class="text-sm text-gray-600" th:text="${audit.changeSummary}"></p>
                            </div>
                        </div>
                    </div>
                    
                    <!-- View Version Button -->
                    <div class="text-right">
                        <a th:href="@{'/bookings/view-version/' + ${audit.auditId}}" 
                           class="text-sm text-blue-600 hover:text-blue-800 font-medium">
                            <i class="fas fa-eye mr-1"></i>
                            View this version
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
