<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>Generate Bill</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss/dist/tailwind.min.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
	<style>
		/* Reset */
		* {
			box-sizing: border-box;
		}
		
		body {
			margin: 0;
			padding: 0;
			padding-left: 280px; /* KEY FIX: Push everything right for sidebar */
			overflow-x: hidden;
			font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			background-color: #f8fafc;
		}

		.bg-overlay {
			position: fixed;
			top: 0;
			left: 0;
			height: 100%;
			width: 100%;
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			opacity: 0.03;
			z-index: -1;
		}

		/* MAIN CONTENT - No margin needed */
		.main-content {
			margin-left: 0;
			transition: margin-left 0.3s ease;
			min-height: 100vh;
			background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
			width: 100%;
		}

		.main-content-expanded {
			margin-left: -200px !important; /* When sidebar is collapsed, pull content left */
		}

		.main-content-full {
			margin-left: 0 !important;
		}

		@media (max-width: 768px) {
			.main-content {
				margin-left: 0 !important;
			}
		}

		.container-card {
			max-width: 1400px;
			margin: 0 auto;
			background: white;
			border-radius: 16px;
			box-shadow: 0 10px 40px rgba(0, 0, 0, 0.06);
			border: 1px solid rgba(0, 0, 0, 0.05);
			transition: transform 0.2s ease, box-shadow 0.2s ease;
			padding: 2rem;
		}

		.container-card:hover {
			box-shadow: 0 15px 50px rgba(0, 0, 0, 0.1);
		}

		.form-label {
			display: block;
			font-weight: 600;
			color: #2d3748;
			margin-bottom: 8px;
			font-size: 14px;
		}

		.form-input {
			width: 100%;
			padding: 12px 16px;
			border: 1.5px solid #e2e8f0;
			border-radius: 10px;
			font-size: 15px;
			transition: all 0.2s ease;
			background-color: #fcfdfe;
		}

		.form-input:focus {
			outline: none;
			border-color: #4299e1;
			box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.15);
			background-color: white;
		}

		.form-select {
			width: 100%;
			padding: 12px 16px;
			border: 1.5px solid #e2e8f0;
			border-radius: 10px;
			font-size: 15px;
			transition: all 0.2s ease;
			background-color: #fcfdfe;
			appearance: none;
			background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
			background-position: right 16px center;
			background-repeat: no-repeat;
			background-size: 1.5em 1.5em;
			padding-right: 40px;
		}

		.form-select:focus {
			outline: none;
			border-color: #4299e1;
			box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.15);
			background-color: white;
		}

		.btn-cancel {
			background-color: #f1f5f9;
			color: #64748b;
			padding: 12px 28px;
			border-radius: 10px;
			font-weight: 600;
			transition: all 0.2s ease;
			border: 1.5px solid #e2e8f0;
			text-decoration: none;
			display: inline-flex;
			align-items: center;
			gap: 8px;
		}

		.btn-cancel:hover {
			background-color: #e2e8f0;
			transform: translateY(-1px);
			text-decoration: none;
			color: #64748b;
		}

		.btn-save {
			background: linear-gradient(135deg, #10b981 0%, #059669 100%);
			color: white;
			padding: 12px 28px;
			border-radius: 10px;
			font-weight: 600;
			transition: all 0.2s ease;
			border: none;
			cursor: pointer;
			display: inline-flex;
			align-items: center;
			gap: 8px;
		}

		.btn-save:hover {
			transform: translateY(-1px);
			box-shadow: 0 5px 15px rgba(16, 185, 129, 0.3);
			color: white;
		}

		.btn-add {
			background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
			color: white;
			padding: 10px 20px;
			border-radius: 8px;
			font-weight: 500;
			border: none;
			cursor: pointer;
			transition: all 0.2s ease;
			display: inline-flex;
			align-items: center;
			gap: 8px;
		}

		.btn-add:hover {
			transform: translateY(-1px);
			box-shadow: 0 5px 15px rgba(59, 130, 246, 0.3);
		}

		.btn-remove {
			background: #ef4444;
			color: white;
			border: none;
			border-radius: 6px;
			width: 32px;
			height: 32px;
			display: flex;
			align-items: center;
			justify-content: center;
			cursor: pointer;
			transition: all 0.2s;
		}

		.btn-remove:hover {
			background: #dc2626;
			transform: scale(1.05);
		}

		.section-title {
			font-size: 18px;
			font-weight: 700;
			color: #1e293b;
			margin-bottom: 20px;
			padding-bottom: 12px;
			border-bottom: 2px solid #f1f5f9;
			position: relative;
		}

		.section-title:after {
			content: '';
			position: absolute;
			bottom: -2px;
			left: 0;
			width: 60px;
			height: 2px;
			background: linear-gradient(90deg, #4299e1 0%, #667eea 100%);
		}

		.grid-2 {
			display: grid;
			grid-template-columns: repeat(2, 1fr);
			gap: 24px;
		}

		@media (max-width: 768px) {
			.grid-2 {
				grid-template-columns: 1fr;
				gap: 16px;
			}
		}

		.radio-group {
			display: flex;
			gap: 20px;
			align-items: center;
		}

		.radio-label {
			display: flex;
			align-items: center;
			gap: 8px;
			cursor: pointer;
			padding: 8px 16px;
			border-radius: 8px;
			transition: all 0.2s ease;
		}

		.radio-label:hover {
			background: #f8fafc;
		}

		.radio-label input[type="radio"]:checked+span {
			color: #3b82f6;
			font-weight: 600;
		}

		.material-item {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 12px 16px;
			background: #f8fafc;
			border-radius: 8px;
			margin-bottom: 8px;
			border: 1px solid #e2e8f0;
			transition: all 0.2s ease;
		}

		.material-item:hover {
			border-color: #4299e1;
			background: #f0f9ff;
		}

		.work-row {
			display: grid;
			grid-template-columns: 50px 1fr 1fr 1fr auto;
			gap: 12px;
			align-items: center;
			padding: 12px;
			background: #f8fafc;
			border-radius: 8px;
			margin-bottom: 8px;
		}

		@media (max-width: 768px) {
			.work-row {
				grid-template-columns: 1fr;
				gap: 8px;
			}
		}

		.toggle-container {
			display: flex;
			align-items: center;
			gap: 20px;
			margin-bottom: 20px;
		}

		.toggle-switch {
			position: relative;
			display: inline-block;
			width: 60px;
			height: 30px;
		}

		.toggle-switch input {
			opacity: 0;
			width: 0;
			height: 0;
		}

		.toggle-slider {
			position: absolute;
			cursor: pointer;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			background-color: #cbd5e0;
			transition: .4s;
			border-radius: 34px;
		}

		.toggle-slider:before {
			position: absolute;
			content: "";
			height: 22px;
			width: 22px;
			left: 4px;
			bottom: 4px;
			background-color: white;
			transition: .4s;
			border-radius: 50%;
		}

		input:checked+.toggle-slider {
			background-color: #10b981;
		}

		input:checked+.toggle-slider:before {
			transform: translateX(30px);
		}

		.transport-fields {
			display: grid;
			grid-template-columns: repeat(2, 1fr);
			gap: 20px;
			margin-top: 15px;
		}

		.transport-fields.hidden {
			display: none;
		}

		/* Smooth animations */
		@keyframes fadeIn {
			from {
				opacity: 0;
				transform: translateY(5px);
			}

			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		.animate-fadeIn {
			animation: fadeIn 0.3s ease-out;
		}

		.required::after {
			content: " *";
			color: #ef4444;
		}

		.form-group {
			margin-bottom: 20px;
		}

		.material-select-group {
			margin-bottom: 10px;
		}

		.selected-materials-section {
			margin-top: 20px;
		}

		.form-actions {
			padding-top: 30px;
			border-top: 1px solid #e2e8f0;
			margin-top: 30px;
			display: flex;
			flex-wrap: wrap;
			justify-content: flex-end;
			gap: 1rem;
		}

		/* New styles for dropdown materials */
		.dropdown-btn {
			width: 100%;
			padding: 12px 16px;
			border: 1.5px solid #e2e8f0;
			border-radius: 10px;
			font-size: 15px;
			background-color: #fcfdfe;
			cursor: pointer;
			text-align: left;
			position: relative;
			transition: all 0.2s ease;
		}

		.dropdown-btn:after {
			content: '▼';
			position: absolute;
			right: 16px;
			top: 50%;
			transform: translateY(-50%);
			font-size: 12px;
			color: #6b7280;
		}

		.dropdown-btn:hover {
			border-color: #cbd5e0;
			background-color: white;
		}

		.dropdown-panel {
			position: absolute;
			z-index: 50;
			margin-top: 8px;
			width: 100%;
			background: white;
			border-radius: 10px;
			box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
			border: 1px solid #e2e8f0;
			max-height: 240px;
			overflow-y: auto;
			display: none;
		}

		.dropdown-item {
			display: flex;
			align-items: center;
			padding: 12px 16px;
			cursor: pointer;
			transition: background-color 0.15s ease;
		}

		.dropdown-item:hover {
			background-color: #f8fafc;
		}

		.dropdown-item input[type="checkbox"] {
			margin-right: 12px;
			width: 18px;
			height: 18px;
			border-radius: 4px;
			border: 1.5px solid #cbd5e0;
			cursor: pointer;
		}

		.selected-chip {
			display: inline-flex;
			align-items: center;
			background: #d1fae5;
			color: #065f46;
			padding: 6px 12px;
			border-radius: 20px;
			font-size: 13px;
			font-weight: 500;
			margin: 4px 4px 4px 0;
		}

		.selected-chip i {
			margin-left: 6px;
			cursor: pointer;
			font-size: 12px;
		}

		/* Toast notification styles */
		.toast-notification {
			position: fixed;
			top: 20px;
			right: 20px;
			padding: 1rem 1.5rem;
			border-radius: 12px;
			box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
			z-index: 9999;
			animation: slideInRight 0.3s ease;
			max-width: 400px;
			display: flex;
			align-items: center;
			gap: 0.75rem;
		}

		.toast-notification.success {
			background: #10b981;
			color: white;
		}

		.toast-notification.error {
			background: #ef4444;
			color: white;
		}

		.toast-notification.info {
			background: #3b82f6;
			color: white;
		}

		@keyframes slideInRight {
			from {
				transform: translateX(100%);
				opacity: 0;
			}
			to {
				transform: translateX(0);
				opacity: 1;
			}
		}

		@keyframes slideOutRight {
			from {
				transform: translateX(0);
				opacity: 1;
			}
			to {
				transform: translateX(100%);
				opacity: 0;
			}
		}

		/* Responsive */
		@media (max-width: 1200px) {
			body {
				padding-left: 240px;
			}
		}

		@media (max-width: 1024px) {
			body {
				padding-left: 220px;
			}
			
			.container-card {
				padding: 1.5rem;
			}
		}

		@media (max-width: 768px) {
			body {
				padding-left: 0 !important;
			}
			
			.main-content {
				margin-left: 0 !important;
			}

			.main-content-expanded {
				margin-left: 0 !important;
			}

			.main-content-full {
				margin-left: 0 !important;
			}

			.container-card {
				padding: 1rem;
				margin: 0 12px;
			}

			.form-actions {
				flex-direction: column;
				gap: 0.75rem;
			}

			.btn-cancel, .btn-save {
				width: 100%;
				justify-content: center;
			}

			.toast-notification {
				top: 10px;
				right: 10px;
				left: 10px;
				max-width: none;
				padding: 0.75rem 1rem;
				font-size: 0.9rem;
			}
		}

		@media (max-width: 480px) {
			.container-card {
				padding: 0.75rem;
				margin: 0 8px;
			}
			
			.transport-fields {
				grid-template-columns: 1fr;
			}
		}

		/* MacOS specific adjustments */
		@supports (-webkit-appearance: none) {
			body {
				-webkit-font-smoothing: antialiased;
			}

			.main-content {
				-webkit-font-smoothing: antialiased;
			}
		}
	</style>
</head>

<body class="bg-gray-50">
	<!-- Background Overlay -->
	<div class="bg-overlay"></div>

	<!-- Admin Sidebar -->
	<div th:replace="fragments/admin-navbar :: admin-sidebar"></div>

	<!-- Main Content Area -->
	<div class="main-content" id="mainContent">
		<!-- Top Navbar -->
		<div th:replace="fragments/bill-top-navbar :: top-navbar"></div>

		<!-- Main Form Content -->
		<div class="max-w-6xl mx-auto px-4 py-8">
			<div class="container-card">
				<!-- Header -->
				<div class="mb-10">
					<h2 class="text-3xl font-bold text-gray-800 mb-2">Generate / Edit Bill</h2>
					<p class="text-gray-600">Fill in all the required details to create or edit a bill</p>
				</div>

				<!-- Form -->
				<form th:action="@{/generateBills/saveGenerateBill}" th:object="${generateBill}" method="post"
					class="space-y-8 animate-fadeIn">

					<input type="hidden" th:field="*{billId}" />

					<!-- Section 1: Customer Information -->
					<div>
						<h3 class="section-title">Customer Information</h3>
						<div class="grid-2">
							<div class="form-group">
								<label class="form-label">Customer Name</label>
								<input type="text" th:field="*{customerName}" class="form-input"
									placeholder="Enter customer name" />
							</div>
							<div class="form-group">
								<label class="form-label">Customer Mobile No.</label>
								<input type="text" th:field="*{mobileNo}" class="form-input"
									placeholder="Enter mobile number" />
							</div>
							<div class="form-group md:col-span-2">
								<label class="form-label">Work Address</label>
								<input type="text" th:field="*{workAddress}" class="form-input"
									placeholder="Enter work address" />
							</div>
						</div>
					</div>

					<!-- Section 2: Boring Details -->
					<div>
						<h3 class="section-title">Boring Specifications</h3>
						<div class="grid-2">
							<div class="form-group">
								<label class="form-label">Work Date</label>
								<input type="date" th:field="*{workDate}" class="form-input" />
							</div>
							<div class="form-group">
								<label class="form-label">Boring Type</label>
								<select th:field="*{boringType}" class="form-select">
									<option value="">-- Select Boring Type --</option>
									<option value="DTH">DTH</option>
									<option value="In-Well">In-Well</option>
									<option value="Rotary">Rotary</option>
									<option value="Callis">Callis</option>
								</select>
							</div>
							<div class="form-group">
								<label class="form-label">Boring Diameter</label>
								<select th:field="*{boringDia}" class="form-select">
									<option value="">-- Select Boring Diameter --</option>
									<option value="5">5 inch</option>
									<option value="6">6 inch</option>
									<option value="8">8 inch</option>
									<option value="10">10 inch</option>
									<option value="12">12 inch</option>
								</select>
							</div>
							<div class="form-group">
								<label class="form-label">Price Quantity Details</label>
								<div class="radio-group">
									<label class="radio-label">
										<input type="radio" th:field="*{priceQntDtls}" value="1 Feet" />
										<span>1 Feet</span>
									</label>
									<label class="radio-label">
										<input type="radio" th:field="*{priceQntDtls}" value="1 Mtr." />
										<span>1 Meter</span>
									</label>
								</div>
							</div>
						</div>
					</div>

					<!-- Section 3: Drilling Details -->
					<div>
						<h3 class="section-title">Drilling Details</h3>
						<div class="grid-2">
							<div class="form-group">
								<label class="form-label">Drilling Price</label>
								<input type="number" th:field="*{drillingPrice}" class="form-input"
									placeholder="Enter drilling price" />
							</div>
							<div class="form-group">
								<label class="form-label">Total Drilling</label>
								<input type="number" th:field="*{totalDrilling}" class="form-input"
									placeholder="Enter total drilling" />
							</div>
						</div>
					</div>

					<!-- Section 4: Materials (Modified to match quotation form) -->
					<div>
						<h3 class="section-title">Required Materials</h3>
						<div class="relative">
							<label class="form-label mb-2">Select Required Materials</label>
							<div class="dropdown-btn" id="dropdown-btn">
								Select Materials
							</div>
							<div id="dropdown-panel" class="dropdown-panel">
								<div th:each="mat : ${materials}" class="dropdown-item">
									<input type="checkbox" 
										   th:id="'mat-' + ${mat.materialId}"
										   th:value="${mat.materialId}" 
										   th:data-name="${mat.materialWithCmpName}"
										   name="requiredMaterialIds" 
										   class="material-checkbox" />
									<label th:for="'mat-' + ${mat.materialId}"
										   th:text="${mat.materialWithCmpName}"
										   class="cursor-pointer flex-1"></label>
								</div>
							</div>

							<!-- Selected Materials Display -->
							<div id="selected-container" class="mt-4">
								<p class="form-label">Selected Materials:</p>
								<div id="selected-materials" class="flex flex-wrap gap-2 mt-2"></div>
							</div>
						</div>
					</div>

					<!-- Section 5: Transport Details -->
					<div>
						<h3 class="section-title">Transportation Details</h3>
						<div class="toggle-container">
							<span class="form-label">Transport Required?</span>
							<label class="toggle-switch">
								<input type="checkbox" id="transportToggle"
									th:checked="${generateBill.transportingVehicleType != null or generateBill.transportingPrice != null}" />
								<span class="toggle-slider"></span>
							</label>
							<span id="toggleLabel"
								th:text="${(generateBill.transportingVehicleType != null or generateBill.transportingPrice != null) ? 'Yes' : 'No'}">
								No
							</span>
						</div>

						<!-- Transport fields -->
						<div id="transportFields" class="transport-fields"
							th:class="${(transportingVehicleType != null or transportingPrice != null) ? '' : 'hidden'}">
							<div class="form-group">
								<label class="form-label">Vehicle Type</label>
								<select th:field="*{transportingVehicleType}" class="form-select">
									<option value="">-- Select Vehicle Type --</option>
									<option value="small">Small</option>
									<option value="medium">Medium</option>
									<option value="large">Large</option>
								</select>
							</div>
							<div class="form-group">
								<label class="form-label">Transport Price</label>
								<input type="number" th:field="*{transportingPrice}" class="form-input"
									placeholder="Enter transport price" />
							</div>
						</div>
					</div>

					<!-- Section 6: Other Works -->
					<div>
						<div class="flex flex-wrap justify-between items-center gap-4 mb-6">
							<h3 class="section-title mb-0">Other Works</h3>
							<button type="button" id="addWorkBtn" class="btn-add">
								<i class="fas fa-plus"></i> Add Work
							</button>
						</div>

						<!-- Other works container -->
						<div id="otherWorkContainer" class="space-y-4">
							<div th:each="ow, iter : ${generateBill.otherWorks}" class="work-row animate-fadeIn">
								<span class="serial font-bold text-center" th:text="${iter.index + 1}"></span>
								<input type="text" th:field="*{otherWorks[__${iter.index}__].othWorkName}"
									class="form-input desc" placeholder="Description" />
								<input type="text" th:field="*{otherWorks[__${iter.index}__].totalUnit}"
									class="form-input unit" placeholder="Total Unit" />
								<input type="number" th:field="*{otherWorks[__${iter.index}__].price}"
									class="form-input price" placeholder="Price" />
								<button type="button" class="btn-remove"
									onclick="this.closest('.work-row').remove(); updateWorkUI();">
									<i class="fas fa-times"></i>
								</button>
							</div>
						</div>
					</div>

					<!-- Section 7: Payment Details -->
					<div>
						<h3 class="section-title">Payment Details</h3>
						<div class="grid-2">
							<div class="form-group">
								<label class="form-label">Total Advance Payment</label>
								<input type="number" th:field="*{totalAdvance}" class="form-input"
									placeholder="Enter advance payment" />
							</div>
						</div>
					</div>

					<!-- Form Actions -->
					<div class="form-actions">
						<a href="/generateBills/getAllBill" class="btn-cancel">
							<i class="fas fa-times mr-2"></i>Cancel
						</a>
						<button type="submit" class="btn-save">
							<i class="fas fa-save mr-2"></i>Save Bill
						</button>
					</div>
				</form>
			</div>
		</div>
	</div>

	<script>
		document.addEventListener("DOMContentLoaded", function () {
			// Initialize main content based on sidebar state
			const sidebar = document.getElementById('sidebar');
			const mainContent = document.getElementById('mainContent');
			
			if (sidebar && mainContent) {
				const savedState = localStorage.getItem('sidebarCollapsed');
				if (savedState === 'true') {
					mainContent.classList.add('main-content-expanded');
					mainContent.classList.remove('main-content-full');
					sidebar.classList.add('sidebar-collapsed');
				} else {
					mainContent.classList.remove('main-content-expanded');
					mainContent.classList.add('main-content-full');
					sidebar.classList.remove('sidebar-collapsed');
				}
			}
			
			// Material dropdown functionality (from quotation form)
			const dropdownBtn = document.getElementById("dropdown-btn");
			const dropdownPanel = document.getElementById("dropdown-panel");
			const checkboxes = dropdownPanel.querySelectorAll(".material-checkbox");
			const selectedContainer = document.getElementById("selected-container");
			const selectedMaterialsDiv = document.getElementById("selected-materials");

			// Toggle dropdown with animation
			dropdownBtn.addEventListener("click", (e) => {
				e.stopPropagation();
				dropdownPanel.style.display = dropdownPanel.style.display === 'block' ? 'none' : 'block';
			});

			// Update selected materials display
			function updateSelected() {
				selectedMaterialsDiv.innerHTML = "";
				let selectedTexts = [];
				
				checkboxes.forEach(cb => {
					if (cb.checked) {
						const materialName = cb.getAttribute("data-name");
						selectedTexts.push(materialName);
						
						// Create chip for selected material
						const chip = document.createElement("div");
						chip.className = "selected-chip";
						chip.innerHTML = `
							${materialName}
							<i class="fas fa-times" data-id="${cb.value}"></i>
						`;
						
						// Add remove functionality
						chip.querySelector("i").addEventListener("click", function() {
							const checkboxId = this.getAttribute("data-id");
							const checkbox = document.querySelector(`.material-checkbox[value="${checkboxId}"]`);
							if (checkbox) {
								checkbox.checked = false;
								updateSelected();
							}
						});
						
						selectedMaterialsDiv.appendChild(chip);
					}
				});

				// Update dropdown button text
				if (selectedTexts.length > 0) {
					dropdownBtn.textContent = `${selectedTexts.length} material(s) selected`;
					selectedContainer.classList.remove("hidden");
				} else {
					dropdownBtn.textContent = "Select Materials";
					selectedContainer.classList.add("hidden");
				}
			}

			// Initialize checkbox event listeners
			checkboxes.forEach(cb => {
				cb.addEventListener("change", updateSelected);
				
				// Prevent closing dropdown when clicking checkbox
				cb.addEventListener("click", (e) => {
					e.stopPropagation();
				});
			});

			// Close dropdown when clicking outside
			document.addEventListener("click", function (event) {
				if (!dropdownBtn.contains(event.target) && !dropdownPanel.contains(event.target)) {
					dropdownPanel.style.display = 'none';
				}
			});

			// Close dropdown when pressing Escape
			document.addEventListener("keydown", function (event) {
				if (event.key === "Escape") {
					dropdownPanel.style.display = 'none';
				}
			});

			// Initialize selected materials from existing data (if editing)
			updateSelected();

			// Transport toggle functionality
			const transportToggle = document.getElementById("transportToggle");
			const transportFields = document.getElementById("transportFields");
			const toggleLabel = document.getElementById("toggleLabel");

			transportToggle.addEventListener("change", function () {
				if (this.checked) {
					transportFields.classList.remove("hidden");
					toggleLabel.textContent = "Yes";
				} else {
					transportFields.classList.add("hidden");
					toggleLabel.textContent = "No";
				}
			});

			// Other works functionality
			const container = document.getElementById("otherWorkContainer");

			function updateWorkSerialNumbers() {
				const rows = container.querySelectorAll(".work-row");
				rows.forEach((row, index) => {
					row.querySelector(".serial").textContent = (index + 1);
				});
			}

			function updateWorkFieldNames() {
				const rows = container.querySelectorAll(".work-row");
				rows.forEach((row, index) => {
					row.querySelector(".desc").name = `otherWorks[${index}].othWorkName`;
					row.querySelector(".unit").name = `otherWorks[${index}].totalUnit`;
					row.querySelector(".price").name = `otherWorks[${index}].price`;
				});
			}

			window.updateWorkUI = function() {
				updateWorkSerialNumbers();
				updateWorkFieldNames();
			}

			document.getElementById("addWorkBtn").addEventListener("click", function () {
				const workDiv = document.createElement("div");
				workDiv.className = "work-row animate-fadeIn";

				const serial = document.createElement("span");
				serial.className = "serial font-bold text-center";

				const descInput = document.createElement("input");
				descInput.type = "text";
				descInput.placeholder = "Description";
				descInput.className = "form-input desc";

				const unitInput = document.createElement("input");
				unitInput.type = "text";
				unitInput.placeholder = "Total Unit";
				unitInput.className = "form-input unit";

				const priceInput = document.createElement("input");
				priceInput.type = "number";
				priceInput.placeholder = "Price";
				priceInput.className = "form-input price";

				const removeBtn = document.createElement("button");
				removeBtn.type = "button";
				removeBtn.className = "btn-remove";
				removeBtn.innerHTML = '<i class="fas fa-times"></i>';
				removeBtn.addEventListener("click", () => {
					workDiv.remove();
						updateWorkUI();
				});

				workDiv.appendChild(serial);
				workDiv.appendChild(descInput);
				workDiv.appendChild(unitInput);
				workDiv.appendChild(priceInput);
				workDiv.appendChild(removeBtn);

				container.appendChild(workDiv);
				updateWorkUI();
			});

			// Initialize UI
			updateWorkUI();

			// Toast notification function
			function showToast(message, type) {
				// Remove existing toasts
				const existingToasts = document.querySelectorAll('.toast-notification');
				existingToasts.forEach(toast => toast.remove());

				const toast = document.createElement('div');
				toast.className = `toast-notification ${type}`;
				toast.innerHTML = `
					<div class="flex items-center gap-3">
						<i class="fas ${type === 'error' ? 'fa-exclamation-circle' : 
									  type === 'success' ? 'fa-check-circle' : 
									  'fa-info-circle'}"></i>
						<span class="font-medium">${message}</span>
					</div>
				`;

				document.body.appendChild(toast);

				// Remove toast after 3 seconds
				setTimeout(() => {
					toast.style.animation = 'slideOutRight 0.3s ease';
					setTimeout(() => {
						if (toast.parentNode) {
							toast.parentNode.removeChild(toast);
						}
					}, 300);
				}, 3000);
			}

			// Form validation
			const form = document.querySelector('form');
			if (form) {
				form.addEventListener('submit', function(e) {
					const customerName = document.querySelector('input[name="customerName"]');
					if (customerName && !customerName.value.trim()) {
						e.preventDefault();
						showToast('Please enter customer name', 'error');
						customerName.focus();
						return false;
					}
				});
			}
		});
	</script>
</body>
</html>
