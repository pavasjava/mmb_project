<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Generate Bill</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss/dist/tailwind.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Reset */
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 0;
            padding-left: 280px; /* KEY FIX: Push everything right for sidebar */
            overflow-x: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f8fafc;
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            opacity: 0.03;
            z-index: -1;
        }

        /* MAIN CONTENT - No margin needed */
        .main-content {
            margin-left: 0;
            transition: margin-left 0.3s ease;
            min-height: 100vh;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            width: 100%;
        }

        .main-content-expanded {
            margin-left: -200px !important; /* When sidebar is collapsed, pull content left */
        }

        .main-content-full {
            margin-left: 0 !important;
        }

        @media (max-width: 768px) {
            .main-content {
                margin-left: 0 !important;
            }
        }

        .container-card {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            padding: 2rem;
        }

        .container-card:hover {
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.1);
        }

        .form-label {
            display: block;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.2s ease;
            background-color: #fcfdfe;
        }

        .form-input:focus {
            outline: none;
            border-color: #4299e1;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.15);
            background-color: white;
        }

        .form-select {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.2s ease;
            background-color: #fcfdfe;
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 16px center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
            padding-right: 40px;
        }

        .form-select:focus {
            outline: none;
            border-color: #4299e1;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.15);
            background-color: white;
        }

        .btn-cancel {
            background-color: #f1f5f9;
            color: #64748b;
            padding: 12px 28px;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.2s ease;
            border: 1.5px solid #e2e8f0;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-cancel:hover {
            background-color: #e2e8f0;
            transform: translateY(-1px);
            text-decoration: none;
            color: #64748b;
        }

        .btn-save {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 12px 28px;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.2s ease;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-save:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.3);
            color: white;
        }

        .btn-add {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: none;
            cursor: pointer;
        }

        .btn-add:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.3);
        }

        .btn-remove {
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 6px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-remove:hover {
            background: #dc2626;
            transform: scale(1.05);
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #f1f5f9;
            position: relative;
        }

        .section-title:after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, #4299e1 0%, #667eea 100%);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
        }

        @media (max-width: 768px) {
            .grid-2 {
                grid-template-columns: 1fr;
                gap: 16px;
            }
        }

        .radio-group {
            display: flex;
            gap: 24px;
            padding: 12px;
            background: #f8fafc;
            border-radius: 10px;
        }

        .radio-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .radio-label:hover {
            background: #f1f5f9;
        }

        .radio-label input[type="radio"]:checked + span {
            color: #3b82f6;
            font-weight: 600;
        }

        .material-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: #f8fafc;
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid #e2e8f0;
        }

        .work-row {
            display: grid;
            grid-template-columns: 50px 1fr 1fr 1fr auto;
            gap: 12px;
            align-items: center;
            padding: 12px;
            background: #f8fafc;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        @media (max-width: 768px) {
            .work-row {
                grid-template-columns: 1fr;
                gap: 8px;
            }
        }

        /* Smooth animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fadeIn {
            animation: fadeIn 0.3s ease-out;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            background: #dbeafe;
            color: #1e40af;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .currency-input {
            position: relative;
        }

        .currency-input::before {
            content: "₹";
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
            font-weight: 600;
            z-index: 10;
        }

        .currency-input .form-input {
            padding-left: 30px;
        }

        .toggle-container {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 12px;
            background: #f8fafc;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 30px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #cbd5e0;
            transition: .4s;
            border-radius: 34px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .toggle-slider {
            background-color: #10b981;
        }

        input:checked + .toggle-slider:before {
            transform: translateX(30px);
        }

        .hidden-fields {
            display: none;
        }

        .show-fields {
            display: grid;
            animation: fadeIn 0.3s ease-out;
        }

        /* Toast notification styles */
        .toast-notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            z-index: 9999;
            animation: slideInRight 0.3s ease;
            max-width: 400px;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .toast-notification.success {
            background: #10b981;
            color: white;
        }

        .toast-notification.error {
            background: #ef4444;
            color: white;
        }

        .toast-notification.info {
            background: #3b82f6;
            color: white;
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideOutRight {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(100%);
                opacity: 0;
            }
        }

        /* Responsive */
        @media (max-width: 1200px) {
            body {
                padding-left: 240px;
            }
        }

        @media (max-width: 1024px) {
            body {
                padding-left: 220px;
            }
            
            .container-card {
                padding: 1.5rem;
            }
        }

        @media (max-width: 768px) {
            body {
                padding-left: 0 !important;
            }
            
            .main-content {
                margin-left: 0 !important;
            }

            .main-content-expanded {
                margin-left: 0 !important;
            }

            .main-content-full {
                margin-left: 0 !important;
            }

            .container-card {
                padding: 1rem;
                margin: 0 12px;
            }

            .form-actions {
                flex-direction: column;
                gap: 0.75rem;
            }

            .btn-cancel, .btn-save {
                width: 100%;
                justify-content: center;
            }

            .toast-notification {
                top: 10px;
                right: 10px;
                left: 10px;
                max-width: none;
                padding: 0.75rem 1rem;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 480px) {
            .container-card {
                padding: 0.75rem;
                margin: 0 8px;
            }
            
            .transport-fields {
                grid-template-columns: 1fr;
            }

            .work-row {
                grid-template-columns: 1fr;
            }
        }

        /* MacOS specific adjustments */
        @supports (-webkit-appearance: none) {
            body {
                -webkit-font-smoothing: antialiased;
            }

            .main-content {
                -webkit-font-smoothing: antialiased;
            }
        }
    </style>
</head>

<body class="bg-gray-50">
    <!-- Background Overlay -->
    <div class="bg-overlay"></div>
    
    <!-- Admin Sidebar -->
    <div th:replace="fragments/admin-navbar :: admin-sidebar"></div>

    <!-- Main Content Area -->
    <div class="main-content" id="mainContent">
        <!-- Top Navbar -->
        <div th:replace="fragments/bill-top-navbar :: top-navbar"></div>

        <!-- Main Form Content -->
        <div class="max-w-6xl mx-auto px-4 py-8">
            <div class="container-card">
                <!-- Header -->
                <div class="mb-10">
                    <div class="flex flex-wrap justify-between items-start gap-4">
                        <div>
                            <h2 class="text-3xl font-bold text-gray-800 mb-2">Generate Bill</h2>
                            <p class="text-gray-600">Fill in all the required details to create a bill</p>
                        </div>
                        <div class="status-badge">
                            <i class="fas fa-circle text-xs mr-2"></i>
                            <span>Draft</span>
                        </div>
                    </div>
                </div>

                <!-- Form -->
                <form th:action="@{/generateBills/saveGenerateBill}" th:object="${generateBill}" method="post" 
                      class="space-y-8 animate-fadeIn">

                    <input type="hidden" th:field="*{billId}" />

                    <!-- Section 1: Customer Information -->
                    <div>
                        <h3 class="section-title">Customer Information</h3>
                        <div class="grid-2">
                            <div>
                                <label class="form-label">Customer Name</label>
                                <input type="text" th:field="*{customerName}" 
                                       class="form-input" 
                                       placeholder="Enter customer name" />
                            </div>
                            <div>
                                <label class="form-label">Mobile Number</label>
                                <input type="text" th:field="*{mobileNo}" 
                                       class="form-input" 
                                       placeholder="Enter mobile number" />
                            </div>
                            <div class="md:col-span-2">
                                <label class="form-label">Work Address</label>
                                <input type="text" th:field="*{workAddress}" 
                                       class="form-input" 
                                       placeholder="Enter work address" />
                            </div>
                        </div>
                    </div>

                    <!-- Section 2: Boring Details -->
                    <div>
                        <h3 class="section-title">Boring Specifications</h3>
                        <div class="grid-2">
                            <div>
                                <label class="form-label">Work Date</label>
                                <input type="date" th:field="*{workDate}" 
                                       class="form-input" />
                            </div>
                            <div>
                                <label class="form-label">Boring Type</label>
                                <select th:field="*{boringType}" class="form-select">
                                    <option value="">-- Select Boring Type --</option>
                                    <option value="DTH">DTH</option>
                                    <option value="In-Well">In-Well</option>
                                    <option value="Rotary">Rotary</option>
                                    <option value="Callis">Callis</option>
                                </select>
                            </div>
                            <div>
                                <label class="form-label">Boring Diameter</label>
                                <select th:field="*{boringDia}" class="form-select">
                                    <option value="">-- Select Boring Diameter --</option>
                                    <option value="5">5 inch</option>
                                    <option value="6">6 inch</option>
                                    <option value="8">8 inch</option>
                                    <option value="10">10 inch</option>
                                    <option value="12">12 inch</option>
                                </select>
                            </div>
                            <div>
                                <label class="form-label">Price Quantity Details</label>
                                <div class="radio-group">
                                    <label class="radio-label">
                                        <input type="radio" th:field="*{priceQntDtls}" value="1 Feet" />
                                        <span>1 Feet</span>
                                    </label>
                                    <label class="radio-label">
                                        <input type="radio" th:field="*{priceQntDtls}" value="1 Mtr." />
                                        <span>1 Meter</span>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Section 3: Drilling Details -->
                    <div>
                        <h3 class="section-title">Drilling Details</h3>
                        <div class="grid-2">
                            <div>
                                <label class="form-label">Drilling Price</label>
                                <div class="currency-input">
                                    <input type="number" th:field="*{drillingPrice}" 
                                           class="form-input" 
                                           placeholder="0.00" />
                                </div>
                            </div>
                            <div>
                                <label class="form-label">Total Drilling</label>
                                <input type="number" th:field="*{totalDrilling}" 
                                       class="form-input" 
                                       placeholder="Enter total drilling" />
                            </div>
                        </div>
                    </div>

                    <!-- Section 4: Materials -->
                    <div>
                        <h3 class="section-title">Required Materials</h3>
                        <div class="relative mb-4">
                            <div>
                                <label class="form-label">Select Material</label>
                                <select id="material" class="form-select">
                                    <option value="">-- Select Material --</option>
                                    <option th:each="mat : ${materials}" th:value="${mat.materialId}"
                                            th:text="${mat.materialWithCmpName}">
                                    </option>
                                </select>
                            </div>
                            
                            <!-- Quantity input -->
                            <div id="material-details" class="hidden mt-4">
                                <div class="flex flex-wrap items-center gap-4">
                                    <div class="flex-1 min-w-[200px]">
                                        <label class="form-label">Quantity</label>
                                        <input type="number" id="quantity" class="form-input" placeholder="Enter quantity" />
                                    </div>
                                    <div class="pt-6">
                                        <button type="button" id="addMaterialBtn" class="btn-add">
                                            <i class="fas fa-plus"></i> Add Material
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Added materials list -->
                        <div class="mt-6 hidden" id="selectedSection">
                            <label class="form-label">Selected Materials</label>
                            <div id="materialsList" class="space-y-2 mt-2"></div>
                        </div>
                    </div>

                    <!-- Section 5: Transport Details -->
                    <div>
                        <h3 class="section-title">Transportation Details</h3>
                        <div class="toggle-container">
                            <span class="form-label">Transport Required?</span>
                            <label class="toggle-switch">
                                <input type="checkbox" id="transportToggle">
                                <span class="toggle-slider"></span>
                            </label>
                            <span id="toggleLabel">No</span>
                        </div>

                        <!-- Transport fields -->
                        <div id="transportFields" class="hidden-fields">
                            <div class="grid-2">
                                <div>
                                    <label class="form-label">Vehicle Type</label>
                                    <select th:field="*{transportingVehicleType}" class="form-select">
                                        <option value="">-- Select Vehicle Type --</option>
                                        <option value="small">Small</option>
                                        <option value="medium">Medium</option>
                                        <option value="large">Large</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="form-label">Transport Price</label>
                                    <div class="currency-input">
                                        <input type="number" th:field="*{transportingPrice}" 
                                               class="form-input" 
                                               placeholder="0.00" />
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Section 6: Other Works -->
                    <div>
                        <div class="flex flex-wrap justify-between items-center gap-4 mb-4">
                            <h3 class="section-title mb-0">Other Works</h3>
                            <button type="button" id="addWorkBtn" class="btn-add">
                                <i class="fas fa-plus"></i> Add Work
                            </button>
                        </div>
                        
                        <!-- Container where new work fields will appear -->
                        <div id="otherWorkContainer" class="space-y-3"></div>
                    </div>

                    <!-- Section 7: Payment Details -->
                    <div>
                        <h3 class="section-title">Payment Details</h3>
                        <div class="grid-2">
                            <div>
                                <label class="form-label">Total Advance Payment</label>
                                <div class="currency-input">
                                    <input type="number" th:field="*{totalAdvance}" 
                                           class="form-input" 
                                           placeholder="0.00" />
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Form Actions -->
                    <div class="pt-8 border-t border-gray-200 flex flex-wrap justify-end gap-4">
                        <a href="/generateBills/getAllBill" class="btn-cancel">
                            <i class="fas fa-times mr-2"></i>Cancel
                        </a>
                        <button type="submit" class="btn-save">
                            <i class="fas fa-save mr-2"></i>Save Bill
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Initialize main content based on sidebar state
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('mainContent');
            
            if (sidebar && mainContent) {
                const savedState = localStorage.getItem('sidebarCollapsed');
                if (savedState === 'true') {
                    mainContent.classList.add('main-content-expanded');
                    mainContent.classList.remove('main-content-full');
                    sidebar.classList.add('sidebar-collapsed');
                } else {
                    mainContent.classList.remove('main-content-expanded');
                    mainContent.classList.add('main-content-full');
                    sidebar.classList.remove('sidebar-collapsed');
                }
            }

            // Material selection functionality
            const materialSelect = document.getElementById("material");
            const materialDetails = document.getElementById("material-details");
            const quantityInput = document.getElementById("quantity");
            const addMaterialBtn = document.getElementById("addMaterialBtn");
            const materialsList = document.getElementById("materialsList");
            const selectedSection = document.getElementById("selectedSection");

            // Show/hide quantity input when material is selected
            materialSelect.addEventListener("change", () => {
                if (materialSelect.value) {
                    materialDetails.classList.remove("hidden");
                    materialDetails.classList.add("animate-fadeIn");
                } else {
                    materialDetails.classList.add("hidden");
                }
            });

            // Add material to list
            addMaterialBtn.addEventListener("click", () => {
                const selectedText = materialSelect.options[materialSelect.selectedIndex]?.text || "";
                const selectedValue = materialSelect.value;
                const quantity = quantityInput.value.trim();

                if (!selectedValue || !quantity) {
                    showToast('Please select a material and enter quantity.', 'error');
                    return;
                }

                const itemDiv = document.createElement("div");
                itemDiv.className = "material-item animate-fadeIn";
                
                // Left side content
                const leftDiv = document.createElement("div");
                leftDiv.className = "flex items-center gap-3 flex-1";
                
                const serialSpan = document.createElement("span");
                serialSpan.className = "text-gray-500 font-medium";
                serialSpan.textContent = (materialsList.children.length + 1) + ".";
                
                const textSpan = document.createElement("span");
                textSpan.textContent = `${selectedText} - Quantity: ${quantity}`;
                
                leftDiv.appendChild(serialSpan);
                leftDiv.appendChild(textSpan);
                
                // Hidden inputs for form submission
                const hiddenId = document.createElement("input");
                hiddenId.type = "hidden";
                hiddenId.name = "requiredMaterialIds";
                hiddenId.value = selectedValue;
                
                const hiddenQty = document.createElement("input");
                hiddenQty.type = "hidden";
                hiddenQty.name = "requiredMaterialQuantities";
                hiddenQty.value = quantity;
                
                // Remove button
                const removeBtn = document.createElement("button");
                removeBtn.type = "button";
                removeBtn.className = "btn-remove";
                removeBtn.innerHTML = '<i class="fas fa-times"></i>';
                removeBtn.addEventListener("click", () => {
                    itemDiv.remove();
                    updateMaterialSerialNumbers();
                    if (materialsList.children.length === 0) {
                        selectedSection.classList.add("hidden");
                    }
                });
                
                itemDiv.appendChild(leftDiv);
                itemDiv.appendChild(hiddenId);
                itemDiv.appendChild(hiddenQty);
                itemDiv.appendChild(removeBtn);
                
                materialsList.appendChild(itemDiv);
                selectedSection.classList.remove("hidden");
                
                // Reset fields
                materialSelect.value = "";
                quantityInput.value = "";
                materialDetails.classList.add("hidden");
                
                updateMaterialSerialNumbers();
                showToast('Material added successfully!', 'success');
            });

            function updateMaterialSerialNumbers() {
                const items = materialsList.querySelectorAll(".material-item");
                items.forEach((item, index) => {
                    const serialSpan = item.querySelector("span.text-gray-500");
                    if (serialSpan) {
                        serialSpan.textContent = (index + 1) + ".";
                    }
                });
            }

            // Transport toggle functionality
            const transportToggle = document.getElementById("transportToggle");
            const transportFields = document.getElementById("transportFields");
            const toggleLabel = document.getElementById("toggleLabel");

            transportToggle.addEventListener("change", function() {
                if (this.checked) {
                    transportFields.classList.remove("hidden-fields");
                    transportFields.classList.add("show-fields");
                    toggleLabel.textContent = "Yes";
                } else {
                    transportFields.classList.remove("show-fields");
                    transportFields.classList.add("hidden-fields");
                    toggleLabel.textContent = "No";
                }
            });

            // Other works functionality
            const container = document.getElementById("otherWorkContainer");

            function updateWorkSerialNumbers() {
                const rows = container.querySelectorAll(".work-row");
                rows.forEach((row, index) => {
                    const serialSpan = row.querySelector(".serial");
                    if (serialSpan) {
                        serialSpan.textContent = (index + 1) + ".";
                    }
                });
            }

            function updateWorkFieldNames() {
                const rows = container.querySelectorAll(".work-row");
                rows.forEach((row, index) => {
                    const desc = row.querySelector(".desc");
                    const unit = row.querySelector(".unit");
                    const price = row.querySelector(".price");
                    
                    if (desc) desc.name = `otherWorks[${index}].othWorkName`;
                    if (unit) unit.name = `otherWorks[${index}].totalUnit`;
                    if (price) price.name = `otherWorks[${index}].price`;
                });
            }

            document.getElementById("addWorkBtn").addEventListener("click", function () {
                const workDiv = document.createElement("div");
                workDiv.className = "work-row animate-fadeIn";

                const serial = document.createElement("span");
                serial.className = "serial font-bold text-gray-600";

                const descInput = document.createElement("input");
                descInput.type = "text";
                descInput.placeholder = "Description";
                descInput.className = "form-input desc";

                const unitInput = document.createElement("input");
                unitInput.type = "text";
                unitInput.placeholder = "Total Unit";
                unitInput.className = "form-input unit";

                const priceInput = document.createElement("input");
                priceInput.type = "number";
                priceInput.placeholder = "Price";
                priceInput.className = "form-input price";

                const removeBtn = document.createElement("button");
                removeBtn.type = "button";
                removeBtn.className = "btn-remove";
                removeBtn.innerHTML = '<i class="fas fa-times"></i>';
                removeBtn.addEventListener("click", () => {
                    workDiv.remove();
                    updateWorkSerialNumbers();
                    updateWorkFieldNames();
                });

                workDiv.appendChild(serial);
                workDiv.appendChild(descInput);
                workDiv.appendChild(unitInput);
                workDiv.appendChild(priceInput);
                workDiv.appendChild(removeBtn);

                container.appendChild(workDiv);

                updateWorkSerialNumbers();
                updateWorkFieldNames();
            });

            // Toast notification function
            function showToast(message, type) {
                // Remove existing toasts
                const existingToasts = document.querySelectorAll('.toast-notification');
                existingToasts.forEach(toast => toast.remove());

                const toast = document.createElement('div');
                toast.className = `toast-notification ${type}`;
                toast.innerHTML = `
                    <div class="flex items-center gap-3">
                        <i class="fas ${type === 'error' ? 'fa-exclamation-circle' : 
                                      type === 'success' ? 'fa-check-circle' : 
                                      'fa-info-circle'}"></i>
                        <span class="font-medium">${message}</span>
                    </div>
                `;

                document.body.appendChild(toast);

                // Remove toast after 3 seconds
                setTimeout(() => {
                    toast.style.animation = 'slideOutRight 0.3s ease';
                    setTimeout(() => {
                        if (toast.parentNode) {
                            toast.parentNode.removeChild(toast);
                        }
                    }, 300);
                }, 3000);
            }

            // Form validation
            const form = document.querySelector('form');
            if (form) {
                form.addEventListener('submit', function(e) {
                    const customerName = document.querySelector('input[name="customerName"]');
                    if (customerName && !customerName.value.trim()) {
                        e.preventDefault();
                        showToast('Please enter customer name', 'error');
                        customerName.focus();
                        return false;
                    }
                });
            }
        });
    </script>
</body>
</html>
