<!-- templates/fragments/navbar.html -->
<div th:fragment="navbar">
    <!-- Modern Navbar -->
    <nav class="navbar-gradient shadow-2xl sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16 md:h-20">
                <!-- Logo Section -->
                <div class="flex items-center space-x-3">
                    <div class="relative">
                        <div class="w-12 h-12 md:w-14 md:h-14 rounded-full overflow-hidden border-4 border-white/30 shadow-lg">
                            <img th:src="@{/images/MMBLogo.jpg}" alt="MMB Borewell Logo" class="w-full h-full object-cover">
                        </div>
                        <div class="absolute -bottom-1 -right-1 w-6 h-6 bg-blue-500 rounded-full flex items-center justify-center border-2 border-white">
                            <i class="fas fa-check text-white text-xs"></i>
                        </div>
                    </div>
                    <div>
                        <h1 class="text-xl md:text-2xl font-bold text-white">MMB Borewell</h1>
                        <p class="text-xs text-blue-100 hidden md:block">Since 2005</p>
                    </div>
                </div>

                <!-- Desktop Navigation & Search -->
                <div class="hidden lg:flex items-center space-x-6">
                    <div class="flex items-center space-x-6">
                        <a th:href="@{/}" class="nav-link text-white font-medium hover:text-blue-100 transition duration-300">
                            <i class="fas fa-home mr-2"></i>Home
                        </a>
                        <a th:href="@{/services}" class="nav-link text-white font-medium hover:text-blue-100 transition duration-300">
                            <i class="fas fa-cogs mr-2"></i>Services
                        </a>
                        <a th:href="@{/articles}" class="nav-link text-white font-medium hover:text-blue-100 transition duration-300">
                            <i class="fas fa-newspaper mr-2"></i>Articles
                        </a>
                        <a th:href="@{/gallery}" class="nav-link text-white font-medium hover:text-blue-100 transition duration-300">
                            <i class="fas fa-images mr-2"></i>Gallery
                        </a>
                        <a th:href="@{/contact}" class="nav-link text-white font-medium hover:text-blue-100 transition duration-300">
                            <i class="fas fa-phone-alt mr-2"></i>Contact
                        </a>
                    </div>
                    
                    <div class="flex items-center space-x-3">
                        <a th:href="@{/quote}" class="bg-white text-blue-600 hover:bg-blue-50 px-4 py-2 rounded-full font-semibold shadow-lg transition duration-300 flex items-center">
                            <i class="fas fa-file-invoice-dollar mr-2"></i>Get Quote
                        </a>
                        
                        <a th:href="@{/login}" class="bg-blue-800 hover:bg-blue-900 text-white px-5 py-2 rounded-full font-semibold shadow-lg transition duration-300 flex items-center">
                            <i class="fas fa-sign-in-alt mr-2"></i>Login
                        </a>
                    </div>
                </div>

                <!-- Mobile Menu Button -->
                <div class="lg:hidden flex items-center space-x-4">
                    <a th:href="@{/login}" class="bg-blue-800 text-white px-4 py-2 rounded-lg font-semibold text-sm flex items-center">
                        <i class="fas fa-sign-in-alt"></i>
                    </a>
                    <button id="mobileMenuButton" class="text-white">
                        <i class="fas fa-bars text-2xl"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Mobile Menu -->
    <div id="mobileMenu" class="mobile-menu fixed inset-0 z-40 lg:hidden">
        <div class="fixed inset-0 bg-black/50" id="mobileMenuOverlay"></div>
        <div class="fixed top-0 left-0 bottom-0 w-80 bg-white shadow-2xl">
            <!--<div class="navbar-gradient p-6">
                <div class="flex justify-between items-center">
                    <div class="flex items-center space-x-3">
                        <div class="w-12 h-12 rounded-full overflow-hidden border-2 border-white">
                            <img th:src="@{/images/MMBLogo.jpg}" alt="Logo" class="w-full h-full object-cover">
                        </div>
                        <div>
                            <h2 class="text-xl font-bold text-white">MMB Borewell</h2>
                            <p class="text-sm text-blue-100">Menu</p>
                        </div>
                    </div>
                    <button id="closeMobileMenu" class="text-white">
                        <i class="fas fa-times text-2xl"></i>
                    </button>
                </div>
            </div>-->
            
            <div class="h-full overflow-y-auto py-6">
                <div class="px-4 space-y-1">
                    <a th:href="@{/}" class="flex items-center px-4 py-3 text-blue-600 bg-blue-50 rounded-lg">
                        <i class="fas fa-home text-lg mr-3"></i>
                        <span class="font-semibold">Home</span>
                    </a>
                    <a th:href="@{/services}" class="flex items-center px-4 py-3 text-gray-700 hover:bg-gray-50 rounded-lg">
                        <i class="fas fa-cogs text-lg mr-3"></i>
                        <span>Services</span>
                    </a>
                    <a th:href="@{/articles}" class="flex items-center px-4 py-3 text-gray-700 hover:bg-gray-50 rounded-lg">
                        <i class="fas fa-newspaper text-lg mr-3"></i>
                        <span>Articles</span>
                    </a>
                    <a th:href="@{/gallery}" class="flex items-center px-4 py-3 text-gray-700 hover:bg-gray-50 rounded-lg">
                        <i class="fas fa-images text-lg mr-3"></i>
                        <span>Gallery</span>
                    </a>
                    <a th:href="@{/contact}" class="flex items-center px-4 py-3 text-gray-700 hover:bg-gray-50 rounded-lg">
                        <i class="fas fa-phone-alt text-lg mr-3"></i>
                        <span>Contact</span>
                    </a>
                    <a th:href="@{/quote}" class="flex items-center px-4 py-3 text-gray-700 hover:bg-gray-50 rounded-lg">
                        <i class="fas fa-file-invoice-dollar text-lg mr-3"></i>
                        <span>Get Quote</span>
                    </a>
                    <a th:href="@{/login}" class="flex items-center px-4 py-3 text-blue-600 bg-blue-50 rounded-lg">
                        <i class="fas fa-sign-in-alt text-lg mr-3"></i>
                        <span>Login</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Mobile menu functionality for public navbar
        const mobileMenuButton = document.getElementById('mobileMenuButton');
        const closeMobileMenu = document.getElementById('closeMobileMenu');
        const mobileMenu = document.getElementById('mobileMenu');
        const mobileMenuOverlay = document.getElementById('mobileMenuOverlay');
        
        if (mobileMenuButton) {
            mobileMenuButton.addEventListener('click', () => {
                mobileMenu.classList.add('open');
                document.body.style.overflow = 'hidden';
            });
        }
        
        if (closeMobileMenu) {
            closeMobileMenu.addEventListener('click', () => {
                mobileMenu.classList.remove('open');
                document.body.style.overflow = '';
            });
        }
        
        if (mobileMenuOverlay) {
            mobileMenuOverlay.addEventListener('click', () => {
                mobileMenu.classList.remove('open');
                document.body.style.overflow = '';
            });
        }
    </script>
    
    <style>
        .navbar-gradient {
            background: linear-gradient(135deg, rgba(30, 64, 175, 0.95) 0%, rgba(14, 165, 233, 0.95) 100%);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        
        .mobile-menu {
            transform: translateX(-100%);
            transition: transform 0.3s ease;
        }
        
        .mobile-menu.open {
            transform: translateX(0);
        }
    </style>
</div>
