<!-- templates/fragments/admin-navbar.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #1e40af;
            --secondary: #0ea5e9;
            --accent: #06b6d4;
            --dark: #1e293b;
            --light: #f8fafc;
        }
        
        .sidebar {
            width: 280px;
            height: 100vh;
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            position: fixed;
            left: 0;
            top: 0;
            transition: all 0.3s ease;
            z-index: 1000;
            overflow-y: auto;
        }
        
        .sidebar-collapsed {
            width: 80px;
        }
        
        .main-content {
            margin-left: 280px;
            transition: all 0.3s ease;
            min-height: 100vh;
            background: #f1f5f9;
        }
        
        .main-content-expanded {
            margin-left: 80px;
        }
        
        .main-content-full {
            margin-left: 0;
        }
        
        .sidebar-menu-item {
            color: #cbd5e1;
            padding: 12px 20px;
            border-radius: 8px;
            margin: 4px 12px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        
        .sidebar-menu-item:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
        
        .sidebar-menu-item.active {
            background: linear-gradient(90deg, #3b82f6, #1d4ed8);
            color: white;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
        
        .sidebar-menu-item i {
            width: 20px;
            text-align: center;
            font-size: 1.1rem;
        }
        
        .sidebar-collapsed .menu-text {
            display: none;
        }
        
        .sidebar-collapsed .sidebar-menu-item {
            justify-content: center;
            padding: 12px;
        }
        
        .notification-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #ef4444;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .mobile-menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
            display: none;
        }
    </style>
</head>
<body>
    <!-- Admin Dashboard Sidebar Fragment -->
    <div th:fragment="admin-navbar">
        <!-- Mobile Overlay -->
        <div class="mobile-menu-overlay" id="mobileOverlay"></div>
        
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <!-- Sidebar Header -->
            <!--<div class="p-6 border-b border-gray-700">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <div class="w-12 h-12 rounded-full overflow-hidden border-2 border-blue-500">
                            <img th:src="@{/images/MMBLogo.jpg}" alt="MMB Borewell Logo" class="w-full h-full object-cover">
                        </div>
                        <div id="companyInfo">
                            <h2 class="text-xl font-bold text-white">MMB Borewell</h2>
                            <p class="text-sm text-gray-400">Admin Dashboard</p>
                        </div>
                    </div>
                    <button id="toggleSidebar" class="text-gray-400 hover:text-white hidden lg:block">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                </div>
            </div>-->
            
            <!-- User Profile -->
            <div class="p-4 border-b border-gray-700">
                <div class="flex items-center space-x-3">
                    <div class="relative">
                        <div class="w-12 h-12 rounded-full bg-gradient-to-r from-blue-500 to-cyan-400 flex items-center justify-center">
                            <span class="text-white font-bold text-lg">A</span>
                        </div>
                        <div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 rounded-full border-2 border-gray-800"></div>
                    </div>
                    <div id="userInfo">
                        <h4 class="text-white font-medium">[[${session.user != null ? session.user.username : 'Admin'}]]</h4>
                        <p class="text-sm text-gray-400">System Administrator</p>
                    </div>
                </div>
            </div>
            
            <!-- Navigation Menu -->
            <div class="p-4">
                <h3 class="text-gray-400 text-xs uppercase font-semibold mb-4 tracking-wider" id="menuHeading">MAIN MENU</h3>
                
                <nav class="space-y-1">
                    <a th:href="@{/dashboard}" class="sidebar-menu-item">
                        <i class="fas fa-tachometer-alt"></i>
                        <span class="menu-text">Dashboard</span>
                    </a>
                    
                    <a th:href="@{/articles}" class="sidebar-menu-item">
                        <i class="fas fa-newspaper"></i>
                        <span class="menu-text">Articles</span>
                    </a>
                    
                    <a th:href="@{/showImages}" class="sidebar-menu-item">
                        <i class="fas fa-images"></i>
                        <span class="menu-text">Images Gallery</span>
                    </a>
                    
                    <div class="dropdown relative">
                        <a href="#" class="sidebar-menu-item">
                            <i class="fas fa-industry"></i>
                            <span class="menu-text">Inventory</span>
                            <i class="fas fa-chevron-down ml-auto menu-text"></i>
                        </a>
                        <div class="dropdown-menu absolute left-full top-0 ml-2 w-56 bg-gray-800 rounded-lg shadow-xl py-2 z-50">
                            <a th:href="@{/getAllRawMaterials}" class="block px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white">
                                <i class="fas fa-boxes mr-3"></i>Raw Materials
                            </a>
                            <a th:href="@{/drillingPrice/getAllPrices}" class="block px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white">
                                <i class="fas fa-tags mr-3"></i>Pricing
                            </a>
                            <a th:href="@{/borewellTypes/borewellTypeList}" class="block px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white">
                                <i class="fas fa-water mr-3"></i>Borewell Types
                            </a>
							<a th:href="@{/requirements}"
								class="block px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white">
								<i class="fas fa-water mr-3"></i>Item Requirements
							</a>
                        </div>
                    </div>
                    
                    <div class="dropdown relative">
                        <a href="#" class="sidebar-menu-item">
                            <i class="fas fa-file-invoice-dollar"></i>
                            <span class="menu-text">Operations</span>
                            <i class="fas fa-chevron-down ml-auto menu-text"></i>
                        </a>
                        <div class="dropdown-menu absolute left-full top-0 ml-2 w-56 bg-gray-800 rounded-lg shadow-xl py-2 z-50">
                            <a th:href="@{/quotations/getAllQuotation}" class="block px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white">
                                <i class="fas fa-file-signature mr-3"></i>Quotations
                            </a>
                            <a th:href="@{/bookings/getAllBookings}" class="block px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white">
                                <i class="fas fa-calendar-check mr-3"></i>Bookings
                            </a>
                            <a th:href="@{/generateBills/getAllBill}" class="block px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white">
                                <i class="fas fa-receipt mr-3"></i>Billing
                            </a>
                        </div>
                    </div>
                    
                    <a th:href="@{/users}" class="sidebar-menu-item">
                        <i class="fas fa-users"></i>
                        <span class="menu-text">Users</span>
                    </a>
                    
                    <a th:href="@{/settings}" class="sidebar-menu-item">
                        <i class="fas fa-cog"></i>
                        <span class="menu-text">Settings</span>
                    </a>
                    
                    <a th:href="@{/reports}" class="sidebar-menu-item">
                        <i class="fas fa-chart-bar"></i>
                        <span class="menu-text">Reports</span>
                    </a>
                </nav>
                
                <!-- Bottom Menu -->
                <div class="mt-8 pt-6 border-t border-gray-700">
                    <a th:href="@{/help}" class="sidebar-menu-item">
                        <i class="fas fa-question-circle"></i>
                        <span class="menu-text">Help & Support</span>
                    </a>
                    
                    <form th:action="@{/logout}" method="post" class="mt-2">
                        <button type="submit" class="sidebar-menu-item w-full text-left text-red-400 hover:text-red-300">
                            <i class="fas fa-sign-out-alt"></i>
                            <span class="menu-text">Logout</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

<script th:inline="javascript">
    // Admin Sidebar Toggle
    const sidebar = document.getElementById('sidebar');
    const toggleSidebar = document.getElementById('toggleSidebar');
    const mobileOverlay = document.getElementById('mobileOverlay');
    const companyInfo = document.getElementById('companyInfo');
    const userInfo = document.getElementById('userInfo');
    const menuHeading = document.getElementById('menuHeading');
    
    // Desktop sidebar toggle
    if (toggleSidebar) {
        toggleSidebar.addEventListener('click', () => {
            sidebar.classList.toggle('sidebar-collapsed');
            
            // Rotate icon
            const icon = toggleSidebar.querySelector('i');
            if (sidebar.classList.contains('sidebar-collapsed')) {
                icon.classList.remove('fa-chevron-left');
                icon.classList.add('fa-chevron-right');
                if (companyInfo) companyInfo.style.display = 'none';
                if (userInfo) userInfo.style.display = 'none';
                if (menuHeading) menuHeading.style.display = 'none';
            } else {
                icon.classList.remove('fa-chevron-right');
                icon.classList.add('fa-chevron-left');
                if (companyInfo) companyInfo.style.display = 'block';
                if (userInfo) userInfo.style.display = 'block';
                if (menuHeading) menuHeading.style.display = 'block';
            }
        });
    }
    
    // Active menu highlighting
    const currentPath = window.location.pathname;
    const menuItems = document.querySelectorAll('.sidebar-menu-item');
    
    menuItems.forEach(item => {
        const href = item.getAttribute('href') || '';
        if (href && currentPath.includes(href.replace('@{', '').replace('}', '').replace('/', ''))) {
            item.classList.add('active');
        }
    });
</script>
