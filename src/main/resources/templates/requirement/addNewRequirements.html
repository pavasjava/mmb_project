<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="${requirement.requirementId} != null ? 'Edit Requirement | MMB Borewell Services' : 'Add Requirement | MMB Borewell Services'"></title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <!-- Include common head -->
    <div th:replace="fragments/head :: head"></div>
    
    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss/dist/tailwind.min.css">
    
    <style>
        /* Main content alignment for sidebar */
        .main-content {
            margin-left: 280px;
            transition: all 0.3s ease;
            min-height: 100vh;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
        }
        
        .main-content-expanded {
            margin-left: 80px;
        }
        
        .main-content-full {
            margin-left: 0;
        }
        
        /* Fixed: Wrap top navbar in a container with proper margin */
        
        
        /* Fix for the top navbar's page-header */
        
        
        /* Adjust main content to account for navbar */
		.page-container {
		        padding: 1rem 2rem;
		        width: 100%;
		        max-width: 1400px;
		        margin: 0 auto;
		        margin-top: 1rem; /* Added margin for top navbar */
		    }
        
        .form-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
            padding: 2rem;
            margin-top: 2rem;
        }
        
        .form-input {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            width: 100%;
            transition: all 0.2s ease;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        
        .form-select {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            width: 100%;
            background: white;
            transition: all 0.2s ease;
        }
        
        .form-select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        
        .form-label {
            display: block;
            color: #475569;
            font-weight: 500;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
        }
        
        /* FORM GRID STYLES */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        .action-btn {
            padding: 0.5rem 1.5rem;
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.875rem;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            border: none;
            text-decoration: none;
        }
        
        .action-btn.submit { 
            background: #3b82f6; 
            color: white; 
        }
        
        .action-btn.submit:hover { 
            background: #2563eb; 
            transform: translateY(-1px); 
        }
        
        .action-btn.cancel { 
            background: #64748b; 
            color: white; 
        }
        
        .action-btn.cancel:hover { 
            background: #475569; 
            transform: translateY(-1px); 
        }
        
        /* Your page header - different from top navbar header */
        .page-inner-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 2rem;
            padding-top: 1rem;
        }
        
        /* RESPONSIVE STYLES */
        @media (max-width: 1200px) {
            .form-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 768px) {
            .main-content {
                margin-left: 0 !important;
            }
            
            
            
            .page-container {
                margin-left: 0 !important;
                width: 100%;
                padding: 0 1rem 1rem 1rem;
                margin-top: 0;
            }
            
            .form-grid {
                grid-template-columns: 1fr;
            }
            
            .page-inner-header {
                flex-direction: column;
                gap: 1rem;
                padding-top: 0.5rem;
            }
        }
    </style>
</head>

<body>
    
    <!-- Admin Sidebar -->
    <div th:replace="fragments/admin-navbar :: admin-sidebar"></div>
    
    <!-- Main Content Area -->
    <div class="main-content" id="mainContent">
        <!-- Wrapper for top navbar with proper alignment -->
        <div class="top-navbar-wrapper">
            <!-- Top Navbar -->
            <div th:replace="fragments/requirement-top-navbar :: top-navbar"></div>
        </div>
        
        <!-- Main Content Container -->
        <div class="page-container">
            <!-- Page Header (Your content header, not the top navbar) 
            <div class="page-inner-header" style="margin-left: 130px;">
                <div>
                    <h1 class="text-3xl font-bold text-gray-800">
                        <span th:text="${requirement.requirementId} != null ? 'Edit Requirement' : 'Add New Requirement'"></span>
                    </h1>
                    <p class="text-gray-600 mt-2">Enter area-specific requirements for borewell services</p>
                </div>
                <a th:href="@{/requirements}" class="action-btn cancel">
                    <i class="fas fa-arrow-left"></i>
                    Back to List
                </a>
            </div>-->
            
            <!-- Form Section -->
            <div class="form-container" style="margin-left: 130px;">
                <h2 class="text-xl font-semibold text-gray-800 mb-6">
                    <span th:text="${requirement.requirementId} != null ? 'Update Requirement Details' : 'Enter Requirement Details'"></span>
                </h2>
                
                <!-- Form -->
                <form th:action="${requirement.requirementId} != null ? @{/requirements/update/{id}(id=${requirement.requirementId})} : @{/requirements/save}"
                      th:object="${requirement}" method="post">
                    
					  <div class="form-grid">
					      <!-- City Selection - Different for Add vs Edit -->
					      <div>
					          <label class="form-label">City *</label>
					          
					          <!-- Edit Mode: Show as text -->
					          <div th:if="${requirement.requirementId} != null" class="read-only-value">
					              <div class="form-input bg-gray-50">
					                  <span th:text="${requirement.city?.cityName}">City Name</span>
					                  <input type="hidden" th:field="*{city.cityId}" />
					              </div>
					              <p class="text-xs text-gray-500 mt-1">City cannot be changed</p>
					          </div>
					          
					          <!-- Add Mode: Show as dropdown -->
					          <div th:unless="${requirement.requirementId} != null">
					              <select id="city" th:field="*{city.cityId}" class="form-select" required>
					                  <option value="">-- Select City --</option>
					                  <option th:each="city : ${cities}"
					                          th:value="${city.cityId}"
					                          th:text="${city.cityName}">
					                  </option>
					              </select>
					          </div>
					      </div>
					      
					      <!-- Area Selection - Different for Add vs Edit -->
					      <div>
					          <label class="form-label">Area *</label>
					          
					          <!-- Edit Mode: Show as text -->
					          <div th:if="${requirement.requirementId} != null" class="read-only-value">
					              <div class="form-input bg-gray-50">
					                  <span th:text="${requirement.area?.locationAreaName}">Area Name</span>
					                  <input type="hidden" th:field="*{area.locationAreaId}" />
					              </div>
					              <p class="text-xs text-gray-500 mt-1">Area cannot be changed</p>
					          </div>
					          
					          <!-- Add Mode: Show as dropdown -->
					          <div th:unless="${requirement.requirementId} != null">
					              <select id="area" th:field="*{area.locationAreaId}" class="form-select" required>
					                  <option value="">-- Select Area --</option>
					                  <option th:each="a : ${areas}"
					                          th:value="${a.locationAreaId}"
					                          th:text="${a.locationAreaName}">
					                  </option>
					              </select>
					          </div>
					      </div>						  
					      
					      <!-- Borewell Type - Always dropdown (editable) -->
					      <div>
					          <label class="form-label">Borewell Type *</label>
					          <select id="borewellType" th:field="*{borewellType.borewelTypeid}" class="form-select" required>
					              <option value="">-- Select Borewell Type --</option>
					              <option th:each="b : ${borewellTypes}" 
					                      th:value="${b.borewelTypeid}" 
					                      th:text="${b.name}"
					                      th:selected="${requirement.borewellType != null && requirement.borewellType.borewelTypeid == b.borewelTypeid}">
					              </option>
					          </select>
					      </div>
						  
						<div>
							<label class="form-label">Drilling Size *</label>
							<select id="reqDrillingDia" th:field="*{reqDrillingDia}" class="form-select" required>
								<option value="">-- Select Boring Size --</option>
								<option value="4">4 inch/101.6mm</option>
								<option value="5">5 inch/127mm</option>
								<option value="6">6 inch/152.4mm</option>
								<option value="8">8 inch/203.2mm</option>
								<option value="10">10 inch/254mm</option>
								<option value="12">12 inch/304.8mm</option>
								<option value="oth">Other</option>
							</select>
						</div>
                        
                        <!-- Drilling Depth -->
                        <div>
                            <label class="form-label">Required Drilling Depth (ft) *</label>
                            <input type="number" th:field="*{reqDrillingDepth}" class="form-input" placeholder="Enter depth" required>
                        </div>
                        
                        <!-- Casing Pipe -->
                        <div>
                            <label class="form-label">Required Casing Pipe (piece) *</label>
                            <input type="number" th:field="*{reqCasingPipe}" class="form-input" placeholder="Enter length" required>
                        </div>
                        
                        <!-- Master Casing Pipes -->
                        <div>
                            <label class="form-label">Required 8" Master Casing Pipe (ft)</label>
                            <input type="number" th:field="*{reqMasterCasingPipe}" class="form-input" placeholder="Enter length">
                        </div>
                        
                        <div>
                            <label class="form-label">Required 10" Master Casing Pipe (ft)</label>
                            <input type="number" th:field="*{req10MasterCasingPipe}" class="form-input" placeholder="Enter length">
                        </div>
                        
                        <div>
                            <label class="form-label">Required 12" Master Casing Pipe (ft)</label>
                            <input type="number" th:field="*{req12MasterCasingPipe}" class="form-input" placeholder="Enter length">
                        </div>
                        
                        <div>
                            <label class="form-label">Required 14" Master Casing Pipe (ft)</label>
                            <input type="number" th:field="*{req14MasterCasingPipe}" class="form-input" placeholder="Enter length">
                        </div>
                        
                        <!-- Slotting -->
                        <div>
                            <label class="form-label">Number of Slotting (piece) *</label>
                            <input type="number" th:field="*{noOfSloting}" class="form-input" placeholder="Enter number" required>
                        </div>
                        
                        <!-- Mod Powder -->
                        <div>
                            <label class="form-label">Required Mod Powder (kg) </label>
                            <input type="number" th:field="*{reqModPowder}" class="form-input" placeholder="Enter weight" >
                        </div>
                        
                        <!-- Gravel -->
                        <div>
                            <label class="form-label">Required Gravel (cm) </label>
                            <input type="number" th:field="*{reqGravel}" class="form-input" placeholder="Enter quantity" >
                        </div>
                        
                        <!-- Washing Hours -->
                        <div>
                            <label class="form-label">Washing Hours </label>
                            <input type="number" th:field="*{washingHours}" class="form-input" placeholder="Enter hours" >
                        </div>
                        
                        <!-- Casing Cone -->
                        <div>
                            <label class="form-label">Required Casing Cone (units) </label>
                            <input type="number" th:field="*{reqCasingCone}" class="form-input" placeholder="Enter units" >
                        </div>
                    </div>
                    
                    <!-- Form Actions -->
                    <div class="flex justify-center gap-4 mt-8 pt-6 border-t border-gray-100">
                        <button type="submit" class="action-btn submit">
                            <i class="fas" th:class="${requirement.requirementId} != null ? 'fa-save' : 'fa-plus'"></i>
                            <span th:text="${requirement.requirementId} != null ? 'Update Requirement' : 'Add Requirement'"></span>
                        </button>
                        <a th:href="@{/requirements}" class="action-btn cancel">
                            <i class="fas fa-times"></i>
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Wait for DOM to be fully loaded
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Requirement Entry page loaded');
            
            // Initialize main content based on sidebar state
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('mainContent');
            
            if (sidebar && mainContent) {
                const savedState = localStorage.getItem('sidebarCollapsed');
                if (savedState === 'true') {
                    mainContent.classList.add('main-content-expanded');
                    mainContent.classList.remove('main-content-full');
                } else {
                    mainContent.classList.remove('main-content-expanded');
                    mainContent.classList.add('main-content-full');
                }
            }
            
            // City-Area dynamic loading
            document.getElementById("city").addEventListener("change", loadAreas);

            function loadAreas() {
                const cityId = document.getElementById("city").value;
                const areaDropdown = document.getElementById("area");
                areaDropdown.innerHTML = '<option value="">-- Select Area --</option>';

                if (cityId) {
                    fetch("/api/areas/byCity/" + cityId)
                        .then(res => res.json())
                        .then(data => {
                            data.forEach(area => {
                                const option = document.createElement("option");
                                option.value = area.locationAreaId;
                                option.text = area.locationAreaName;
                                areaDropdown.appendChild(option);
                            });
                        })
                        .catch(err => console.error("Error fetching areas:", err));
                }
            }
            
            // Form validation
            const form = document.querySelector('form');
            if (form) {
                form.addEventListener('submit', function(e) {
                    const city = document.getElementById('city').value;
                    const area = document.getElementById('area').value;
                    const borewellType = document.getElementById('borewellType').value;
                    
                    if (!city || !area || !borewellType) {
                        e.preventDefault();
                        alert('Please fill all required fields marked with * before submitting.');
                        return false;
                    }
                });
            }
        });
        
        // Prevent back button
        window.history.pushState(null, "", window.location.href);
        window.onpopstate = function() {
            window.history.pushState(null, "", window.location.href);
        };
    </script>
</body>
</html>
