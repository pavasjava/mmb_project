<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Update Credentials</title>

    <style>
        @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap");

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;

            /* SAME BACKGROUND IMAGE LIKE LOGIN */
            background:
                linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)),
                url('/images/groundwater.jpg') no-repeat center center / cover;
        }

        .glass-card {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            border-radius: 16px;

            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.3);

            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            animation: fadeIn 0.8s ease-in-out;
            text-align: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        h2 {
            color: #fff;
            font-size: 1.9rem;
            font-weight: 600;
            margin-bottom: 25px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .input-box {
            width: 100%;
            margin-bottom: 18px;
        }

        .input-box input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.6);
            background: rgba(255,255,255,0.25);
            color: #fff;
            font-size: 1rem;

            outline: none;
            transition: 0.3s ease;
        }

        .input-box input::placeholder {
            color: #f2f2f2;
        }

        .input-box input:focus {
            background: rgba(255,255,255,0.35);
            border-color: #fff;
            box-shadow: 0 0 10px rgba(255,255,255,0.6);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;

            background: linear-gradient(135deg, #00b7ff, #007bcb);
            color: #fff;
            transition: 0.3s ease;
            box-shadow: 0 6px 20px rgba(0, 153, 255, 0.4);
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #00cbff, #0094ff);
            transform: translateY(-2px);
        }

        .message,
        .error {
            margin-top: 15px;
            font-size: 0.95rem;
            font-weight: 500;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .error {
            color: #ff6b6b;
        }
    </style>
</head>

<body>

<div class="glass-card">

    <form th:action="@{/updateUserNameAndPwd}" method="post">

        <h2>Update Credentials</h2>

        <div class="input-box">
            <input type="text" id="email" name="email" placeholder="Enter Email" required>
        </div>

        <div class="input-box">
            <input type="password" id="password" name="password" placeholder="Enter New Password" required>
        </div>

        <button type="submit" class="btn-submit">Update</button>
    </form>

    <p class="message" th:text="${message}"></p>
    <p class="error" th:text="${error}"></p>

</div>

</body>
</html>
