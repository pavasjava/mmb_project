<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Login</title>

	<style>
		@import url("https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap");

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			font-family: "Open Sans", sans-serif;
		}

		body {
			display: flex;
			align-items: center;
			justify-content: center;
			min-height: 100vh;
			width: 100%;
			padding: 0 10px;

			/* 🌿 Nature Background */
			background: url("https://images.unsplash.com/photo-1501785888041-af3ef285b470") no-repeat center center/cover;
			background-attachment: fixed;
		}

		/* Glassmorphism */
		.wrapper {
			width: 400px;
			border-radius: 12px;
			padding: 30px;
			text-align: center;
			background: rgba(255, 255, 255, 0.15);
			backdrop-filter: blur(12px);
			-webkit-backdrop-filter: blur(12px);
			border: 1px solid rgba(255, 255, 255, 0.3);
			box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
		}

		h2 {
			font-size: 2rem;
			margin-bottom: 20px;
			color: #fff;
			font-weight: 600;
		}

		.input-field {
			position: relative;
			border-bottom: 2px solid rgba(255, 255, 255, 0.6);
			margin: 20px 0;
		}

		.input-field label {
			position: absolute;
			top: 50%;
			left: 0;
			transform: translateY(-50%);
			color: #fff;
			font-size: 16px;
			pointer-events: none;
			transition: 0.2s ease;
		}

		.input-field input {
			width: 100%;
			height: 40px;
			background: transparent;
			border: none;
			outline: none;
			font-size: 16px;
			color: #fff;
		}

		.input-field input:focus~label,
		.input-field input:valid~label {
			font-size: 0.75rem;
			top: 10px;
			transform: translateY(-120%);
		}

		.forget {
			display: flex;
			align-items: center;
			justify-content: space-between;
			margin: 25px 0 35px 0;
			color: #fff;
			font-size: 15px;
		}

		button {
			background: #fff;
			color: #000;
			font-weight: 600;
			border: none;
			padding: 12px 20px;
			cursor: pointer;
			border-radius: 4px;
			font-size: 16px;
			transition: 0.3s ease;
			width: 100%;
		}

		button:hover {
			background: rgba(255, 255, 255, 0.3);
			color: white;
			border: 2px solid white;
		}

		.circle {
			width: 90px;
			height: 90px;
			border-radius: 50%;
			background: rgba(255, 255, 255, 0.8);
			display: flex;
			align-items: center;
			justify-content: center;
			margin: 0 auto 20px auto;
			overflow: hidden;
		}

		.circle img {
			width: 100%;
			height: 100%;
			object-fit: contain;
		}

		.register {
			margin-top: 20px;
			color: white;
		}

		.register a {
			color: yellow;
			font-weight: bold;
		}
	</style>
</head>

<body>

	<div class="wrapper">
		<form method="POST" action="/loginreq">

			<div class="circle">
				<img src="/images/MMBLogo.jpg" alt="Company Logo">
			</div>

			<h2>Login</h2>

			<div class="input-field">
				<input type="text" name="username" required>
				<label>Enter your email</label>
			</div>

			<div class="input-field">
				<input type="password" name="password" required>
				<label>Enter your password</label>
			</div>

			<div class="forget">
				<label>
					<input type="checkbox" id="remember"> Remember me
				</label>
				<a href="/updateCredentials" style="color:white;">Forgot password?</a>
			</div>

			<button type="submit">Log In</button>

			<div class="register">
				<p>Don't have an account? <a href="/index">Register</a></p>
			</div>

		</form>
	</div>

</body>
</html>
